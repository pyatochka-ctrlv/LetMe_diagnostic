<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сценарій уроку — Острів суперсил</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E2A5A;--muted:#5B6690;--accent:#6C4DFF;--red:#C8323C;--line:#DCE0EA;--head:'Unbounded','Arial Black',system-ui,sans-serif;--text:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#EEF1F7;color:var(--navy);font:15px/1.5 var(--text)}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar h1{font:700 17px var(--head);margin:0;flex:1;min-width:260px}
.sw{display:flex;border:1.5px solid var(--navy);border-radius:999px;overflow:hidden}
.sw button{font:700 14px var(--text);border:0;background:#fff;padding:7px 14px;cursor:pointer;color:var(--navy)}
.sw button[aria-pressed="true"]{background:var(--accent);color:#fff}
.wrap{max-width:960px;margin:0 auto;padding:18px 18px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px}
h2{font:700 18px var(--head);margin:0 0 10px}
h3{font:800 15px var(--text);margin:12px 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid #E3E7F0;padding:5px 6px;text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.st-head{display:flex;align-items:center;gap:12px}
.st-head .ic{font-size:30px}.st-head h2{flex:1;margin:0}
.time{font:700 13px var(--head);background:#FFC93C;border:1.5px solid var(--navy);border-radius:999px;padding:2px 12px}
.step{border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}
.say{border-left:5px solid var(--accent);background:#F6F4FF;border-radius:0 10px 10px 0;padding:8px 14px;font-size:17px;font-weight:600;margin:4px 0}
.lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px}
.dont{color:var(--red)}
.note{font-size:13px;color:var(--muted)}
ul{margin:4px 0;padding-left:20px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:none;font-size:12px}.bar{position:static;border:0}.sw{display:none}
  .card{break-inside:avoid;page-break-inside:avoid;border:1.5px solid #999;margin-bottom:10px;padding:10px 12px}
  .say{background:none;font-size:13.5px}.time{background:none}.wrap{max-width:none;padding:0}
}
</style>
</head>
<body>
<div class="bar"><h1>🏝️ Острів суперсил — сценарій уроку <span class="note" id="cur"></span></h1>
  <div class="sw" id="swg"><button data-g="78">7–8 років</button><button data-g="910">9–10 років</button></div>
  <div class="sw" id="swv"><button data-v="A">Версія А</button><button data-v="B">Версія Б</button></div>
</div>
<div class="wrap" id="out"></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script>
/* Статичний сценарій: усі тексти беруться з config.js, тож не розходяться з пультом і грою. */
let G = '78', VER = 'A';
try { G = localStorage.getItem('ostriv-scen-g') || '78'; VER = localStorage.getItem('ostriv-scen-v') || 'A'; } catch (e) { }
const E = s => esc(String(s ?? '')).replace(/\{([^{}|]*)\|([^{}|]*)\}/g, '$1($2)');   // рід: «мріяв(ла)» — вчитель обирає форму
const P = v => pick78(v, G);
const STEPS = {
  hero: ['pick'], emotions: ['intro', 'frames', 'calmReady', 'calm'], safe: ['intro', 'trial', 'play', 'opened'],
  money: { '78': ['intro', 'buy', 'sell', 'evening'], '910': ['intro', 'day', 'sell910', 'evening910'] },
  hike: { '78': ['intro', 'pack', 'bridge'], '910': ['intro', 'plan', 'rain', 'replan'] },
  bob: { '78': ['intro', 'talk', 'trade', 'bye'], '910': ['intro', 'talk', 'trade', 'haggle', 'bye'] },
  playground: { '78': ['intro', 'judge', 'rules'], '910': ['intro', 'piles', 'compromise'] },
  radio: { '78': ['intro', 'q', 'ask'], '910': ['intro', 'q', 'ask', 'opinion'] }, final: ['batteries', 'crown']
};
const CODES = { emotions: ['calm'], bob: G => (G === '910' ? ['bobTalk', 'bobHaggle'] : ['bobTalk']), playground: G => (G === '78' ? ['judge'] : []), radio: G => (G === '910' ? ['radioAnswer', 'radioAsk', 'radioOpinion'] : ['radioAnswer', 'radioAsk']) };
function codesTable(key) {
  const c = CONFIG.codes[key];
  return `<h3>Коди: ${E(c.title)}</h3><table><tr><th style="width:34%">Код на пульті</th><th>Приклади відповідей</th></tr>${c.items.map(i => `<tr><td><b>${E(i.label)}</b></td><td>${(i.ex || []).map(E).join('<br>')}</td></tr>`).join('')}</table>`;
}
function contentBlock(key) {
  const V = CONFIG.versions[VER][key] || {}, C = Object.assign({}, V, V[G] || {});
  if (key === 'emotions') return G === '78'
    ? `<h3>Комікси (вчитель читає підписи)</h3><ul>${C.comics.map(c => `<li><b>${E(c.title)}:</b> ${c.frames.map(f => E(f.caption)).join(' → ')}</li>`).join('')}</ul>`
    : `<h3>Історії (дитина читає сама)</h3><ul>${C.cases.map(c => `<li><b>${E(c.title)}.</b> ${E(c.text)}<br><span class="note">${c.frames.map(f => E(f.question)).join(' / ')}</span></li>`).join('')}</ul>`;
  if (key === 'safe') return `<p class="note"><b>Пробна спроба:</b> перед справжнім сейфом — маленький замок на ${C.trial.slots} місця з ${C.trial.fruits.length} фруктів (${C.trial.fruits.join(' ')}). Розв’язуєте разом, можна пояснювати кольори; не оцінюється, без таймера. Потім — замок 1 (${C.locks[0].slots} місця з ${C.locks[0].fruits.length} фруктів) і бонусний замок 2. Таймер станції — ${CONFIG.thresholds.safe.totalSec / 60} хв. «Застрягла» = 3 спроби поспіль без нового зеленого.</p>`;
  if (key === 'money') return G === '78'
    ? `<p class="note">${E(C.title)}: ${C.budget} монет. Товари: ${C.goods.map(g => `${g.e} ${E(g.name)} (${g.price})`).join(', ')}. Увечері: скарбничка на ${E(C.goal.name.toLowerCase())} (${C.goal.price}) і ${E(C.shelf.name.toLowerCase())} (${C.shelf.price}).</p>`
    : `<p class="note">${E(C.title)}: старт ${C.start} грн, оренда ${C.rent} грн/день, ціль — ${E(C.goal.name.toLowerCase())} за ${C.goal.price} грн. Погода по днях: ${C.weather.map(w => CONFIG.weatherNames[w].name.toLowerCase()).join(', ')}. Пастка: ${E(C.trap.name)} (${C.trap.price} грн).</p>`;
  if (key === 'hike') return G === '78'
    ? `<p class="note">Прогноз: ${E(C.forecast.text)}. Речі: ${C.items.map(i => E(i.name.toLowerCase())).join(', ')}. Шляхи: ${C.routes.map(r => `${E(r.name.toLowerCase())} (${r.suns}☀️)`).join(', ')}.</p>`
    : `<p class="note">Справи: ${C.blocks.map(b => `${E(b.name.toLowerCase())} (${b.dur} год)`).join(', ')}. Правила: ${Object.values(C.rules).map(E).join('; ')}. Несподіванка: ${E(C.rain.text)}.</p>`;
  if (key === 'bob') return `<p class="note">Потрібна ${E(C.need.name)}. Бажання Боба: «${E(C.wish.text)}» Рюкзак: ${C.items.map(i => E(i.name.toLowerCase())).join(', ')}. Після двох «Вимагає» Боб іде; максимум ${C.maxReplies} реплік. Плащ Боб дарує за будь-якого результату.</p>`;
  if (key === 'playground') return G === '78'
    ? `<p class="note">Суперечка за ${E(C.judge.about)}: Мія — «${E(C.judge.mia)}», Тім — «${E(C.judge.tim)}». Картки правил: ${C.cards.map(c => `«${E(c.text)}»`).join(', ')}.</p>`
    : `<p class="note">Фрази: ${C.phrases.map(p => `«${E(p.text)}»`).join(' ')} Бажання: Котики — ${E(C.teams.cats.wishes.join(', ').toLowerCase())}; Лисички — ${E(C.teams.foxes.wishes.join(', ').toLowerCase())}.</p>`;
  if (key === 'radio') return `<h3>Питання</h3><ol>${C.questions.map(q => `<li>${E(q)}</li>`).join('')}</ol>${G === '910' ? `<p class="note">Теми «Думки за 30 секунд»: ${C.topics.map(t => `«${E(t)}»`).join(', ')}.</p>` : ''}`;
  return '';
}
function vars(key) {
  const V = CONFIG.versions[VER][key] || {}, C = Object.assign({}, V, V[G] || {});
  const v = { title: '[назва комікса]', caption: '[підпис кадру]', question: '[питання]', n: '[номер дня]', text: '' };
  if (key === 'hike' && G === '78') v.text = C.forecast.text;
  if (key === 'bob') v.text = C.need ? C.need.name : '';
  if (key === 'playground' && G === '78') v.text = C.judge.about;
  return v;
}
function station(key) {
  const L = CONFIG.locations[key], steps = P(STEPS[key]), sc = CONFIG.script[key], sk = CONFIG.skills.find(s => s.key === key);
  const stepsHtml = steps.map(st => { const x = sc[st]; if (!x) return ''; const vv = key === 'bob' && st === 'haggle' ? { text: (CONFIG.versions[VER].bob.lines || {}).haggle } : vars(key);
    return `<div class="step"><div class="say">${E(fill(P(x.say), vv))}</div><div class="cols"><div><div class="lbl">Що робиш ти</div>${E(fill(P(x.do), vv))}</div>${x.dont ? `<div class="dont"><div class="lbl" style="color:var(--red)">Не кажи / не роби</div>${E(P(x.dont))}</div>` : '<div></div>'}</div></div>`; }).join('');
  const codes = (typeof CODES[key] === 'function' ? CODES[key](G) : CODES[key] || []).map(codesTable).join('');
  const probes = sk ? `<p class="note">Навичка: <b>${E(sk.area)}</b>. Проби: ${probeNames(key, G).filter(p => p !== '—').map(E).join(' · ')}.</p>` : '';
  return `<div class="card"><div class="st-head"><span class="ic">${L.icon}</span><h2>${E(L.name)}</h2><span class="time">${L.minutes} хв</span></div>${probes}${contentBlock(key)}${stepsHtml}${codes}
    ${key !== 'hero' && key !== 'final' ? `<div class="step"><div class="say">${E(CONFIG.script.done.say)}</div><div class="note">Після кожної локації: ${E(CONFIG.script.done.do)} Предмет костюма видається завжди, навіть якщо станцію пропущено.</div></div>` : ''}</div>`;
}
function render() {
  document.querySelectorAll('#swg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.g === G));
  document.querySelectorAll('#swv button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === VER));
  document.getElementById('cur').textContent = `· ${CONFIG.groups[G].label} · ${CONFIG.versionsMeta[VER]}`;
  const timing = CONFIG.order.map(k => `<tr><td>${CONFIG.locations[k].icon} ${E(CONFIG.locations[k].name)}</td><td>${CONFIG.locations[k].minutes} хв</td></tr>`).join('');
  const total = CONFIG.order.reduce((a, k) => a + CONFIG.locations[k].minutes, 0);
  document.getElementById('out').innerHTML = `
  <div class="card"><h2>Таймінг</h2><table>${timing}<tr><td><b>Разом</b></td><td><b>${total} хв + запас до ${CONFIG.planMinutes}</b></td></tr></table></div>
  <div class="card"><h2>Загальні правила</h2><ul>
    <li>Нейтральні фрази: «Записала», «Дякую, далі», «Прийнято», «Цікаво!».</li>
    <li>Не підказуй і не повторюй відповідь дитини оцінною інтонацією.</li>
    <li>Не порівнюй з іншими дітьми.</li>
    <li>«Дитина попросила підказку» і «Дитина зупинилась» — лише з ініціативи дитини.</li>
    <li>Хвали зусилля, а не результат. Під час уроку на пульті немає балів — вони з’являться лише у звіті.</li>
    <li>Тексти зі словами на кшталт «мріяв(ла)» читай у роді дитини.</li></ul></div>
  <div class="card"><h2>Технічна пам’ятка</h2><ol>
    <li>Відкрий <b>pult.html</b> — це пульт, його дитина не бачить.</li>
    <li>Заповни налаштування: ім’я дитини (без прізвища), своє ім’я, групу, вік, стать і версію (А — вхідна, Б — повторна).</li>
    <li>Натисни «Відкрити вікно гри». Якщо браузер його заблокував — дозволь спливні вікна або відкрий index.html вручну в тому самому браузері.</li>
    <li>Коли на пульті «Вікно гри підключено», у Zoom демонструй <b>тільки вікно «Острів суперсил»</b>, не весь екран. Щоб у грі був звук, один раз клікни у вікні гри до демонстрації.</li>
    <li>Гарячі клавіші пульта: Enter — «Далі», пробіл — «+1 спосіб» у Кіностудії, Ctrl+Z — «Стерти останнє».</li>
    <li>Після фіналу звіт для батьків відкривається на пульті. Там же — «Зберегти PDF».</li></ol></div>
  ${CONFIG.order.map(station).join('')}`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.g) G = b.dataset.g; if (b.dataset.v) VER = b.dataset.v;
  try { localStorage.setItem('ostriv-scen-g', G); localStorage.setItem('ostriv-scen-v', VER); } catch (er) { }
  render();
});
render();
</script>
</body>
</html>
