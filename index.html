<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Острів суперсил</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E2A5A;--sky:#CDE6FF;--yellow:#FFC93C;--purple:#6C4DFF;--green:#1F9D63;--paper:#FFFDF6;--soft:#EEF6FF;--muted:#5B6690;
  --head:'Unbounded','Arial Black',system-ui,sans-serif;--text:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--navy);font-family:var(--text);overflow:hidden;background-image:radial-gradient(rgba(30,42,90,.07) 2px,transparent 2px);background-size:26px 26px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15}
.app{width:var(--W,1280px);height:var(--H,800px);zoom:var(--z,1);display:grid;grid-template-rows:56px minmax(0,1fr)}
/* ситуація + вміст станції — по центру вільного місця під заголовком */
.sflow{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.sflow>.center,.sflow>.bob,.sflow>.shop,.sflow>.selfgrid,.sflow>.final{flex:0 1 auto}
.top{display:flex;align-items:center;gap:14px;padding:8px 18px}
.brand{font-family:var(--head);font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand b{display:inline-grid;place-items:center;width:34px;height:34px;border:3px solid var(--navy);border-radius:12px;background:var(--yellow);box-shadow:3px 3px 0 var(--navy);font-size:18px}
.prog{margin:0 auto;display:flex;gap:12px;position:relative;align-items:center}
.prog::before{content:"";position:absolute;left:18px;right:18px;top:50%;border-top:3px dashed rgba(30,42,90,.35)}
.dot{position:relative;width:40px;height:40px;border:3px solid var(--navy);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:19px;box-shadow:3px 3px 0 var(--navy);opacity:.5;filter:grayscale(.6)}
.dot.done{background:var(--yellow);opacity:1;filter:none}
.dot.cur{opacity:1;filter:none;outline:4px solid var(--purple);outline-offset:3px}
.main{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;padding:4px 18px 16px;min-height:0}
.aside{display:flex;flex-direction:column;gap:12px;min-height:0}
.iskra{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.iskra-face{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:700;font-size:14px}
.spark{position:relative;width:56px;height:56px}
.spark .f2{position:absolute;inset:0;animation:twinkle 1.2s steps(1) infinite}
@keyframes twinkle{0%{opacity:0}50%{opacity:1}}
.bubble{position:relative;background:#fff;border:3px solid var(--navy);border-radius:18px;box-shadow:4px 4px 0 var(--navy);padding:10px 12px;font-size:15px;line-height:1.35;font-weight:600;min-height:44px}
.bubble::before{content:"";position:absolute;left:18px;top:-11px;width:16px;height:16px;background:#fff;border-left:3px solid var(--navy);border-top:3px solid var(--navy);transform:rotate(45deg)}
.bubble.say{animation:say .45s ease}
@keyframes say{0%{transform:scale(.9);opacity:.3}100%{transform:none;opacity:1}}
.herocard{margin-top:auto;background:#fff;border:4px solid var(--navy);border-radius:24px;box-shadow:6px 6px 0 var(--navy);padding:8px;text-align:center}
.herocard .hname{font-family:var(--head);font-size:13px;font-weight:700;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px{position:relative;display:inline-block;line-height:0}
.px svg{display:block;image-rendering:pixelated}
.px .blink{position:absolute;inset:0;opacity:0;animation:blink 4.2s steps(1) infinite}
@keyframes blink{0%,95%{opacity:0}96%,99%{opacity:1}}
.sway{animation:sway 1.6s steps(1) infinite}
@keyframes sway{0%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.jump{animation:jump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{0%,100%{transform:none}40%{transform:translateY(-24px)}}
.px svg .pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.stage{position:relative;background:var(--paper);border:5px solid var(--navy);border-radius:30px;box-shadow:9px 9px 0 var(--navy);padding:12px 20px 14px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:6px;min-height:44px}
.sicon{display:grid;place-items:center;width:44px;height:44px;border:4px solid var(--navy);border-radius:14px;background:var(--yellow);box-shadow:3px 3px 0 var(--navy);font-size:22px;flex:none}
.kicker{font-size:13px;font-weight:700;color:var(--muted)}
.shead h2{font-size:19px}
/* текст завдання для дитини (і для батьків поруч) */
.task{background:#FFF3C4;border:3px solid var(--navy);border-radius:16px;padding:7px 14px 8px;margin-bottom:10px;box-shadow:3px 3px 0 var(--navy)}
.task .sit{font:600 17px/1.36 var(--text)}
.task .q{font:800 21px/1.25 var(--head);margin-top:3px}
/* Twemoji: емодзі як картинки */
img.emoji{height:1em;width:1em;margin:0 .04em;vertical-align:-0.12em;display:inline-block}
.pxcoin{display:inline-block;vertical-align:-3px;image-rendering:pixelated}
.pxrope{display:block;image-rendering:pixelated}
.timer{margin-left:auto;background:var(--yellow);border:4px solid var(--navy);border-radius:999px;padding:3px 18px;font:800 24px/1.2 var(--head);box-shadow:4px 4px 0 var(--navy);min-width:100px;text-align:center;font-variant-numeric:tabular-nums}
.timer.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.sbody{flex:1;min-height:0;display:flex;flex-direction:column}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-height:0}
.card{background:#fff;border:4px solid var(--navy);border-radius:22px;box-shadow:6px 6px 0 var(--navy);padding:12px 16px}
.huge{font-family:var(--head);font-size:34px;font-weight:800}
.lead{font-size:19px;font-weight:600;line-height:1.35;max-width:820px}
.muted{color:var(--muted)}
.pill{display:inline-block;background:var(--yellow);border:3px solid var(--navy);border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px;box-shadow:3px 3px 0 var(--navy)}
.sel{outline:5px solid var(--purple) !important;outline-offset:3px}
.tile{border:4px solid var(--navy);border-radius:20px;background:#fff;box-shadow:4px 4px 0 var(--navy);display:grid;place-items:center}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:var(--yellow);border:4px solid var(--navy);border-radius:18px;box-shadow:5px 5px 0 var(--navy);padding:10px 22px;font:700 20px var(--head);z-index:20;animation:toast 1.9s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.2s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}
.flysp{position:absolute;font-size:30px;pointer-events:none}
.flysp.new{animation:spfly .8s ease-out}
@keyframes spfly{0%{transform:translate(var(--fx),var(--fy)) scale(.2);opacity:0}100%{transform:none;opacity:1}}
.speech{position:relative;background:#fff;border:4px solid var(--navy);border-radius:20px;box-shadow:5px 5px 0 var(--navy);padding:12px 18px;font:700 20px/1.3 var(--head)}

/* мапа */
.map{position:relative;flex:1;border-radius:22px;overflow:hidden;background:#7FC8F8}
.map svg.isl{position:absolute;inset:0;width:100%;height:100%}
.loc{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.loc .ic{width:48px;height:48px;border:4px solid var(--navy);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:3px 3px 0 var(--navy)}
.loc.done .ic{background:var(--yellow)}
.loc.cur .ic{outline:5px solid var(--purple);outline-offset:3px}
.loc .nm{font:700 12px var(--head);background:#fff;border:2px solid var(--navy);border-radius:8px;padding:1px 6px;white-space:nowrap}
.loc .star{position:absolute;top:-10px;right:-10px;font-size:20px}
.walker{position:absolute;transform:translate(-50%,-100%);transition:left 1.3s steps(14),top 1.3s steps(14);z-index:5}
.splash{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#fff;border:5px solid var(--navy);border-radius:24px;box-shadow:8px 8px 0 var(--navy);padding:12px 22px;width:min(760px,92%);animation:say .5s ease .9s both}
.splash .bigic{font-size:58px;line-height:1}
.splash .lore{font-size:17px;font-weight:600;line-height:1.35}

/* кадри */
.strip{display:flex;gap:16px;justify-content:center;align-items:stretch;width:100%}
.frame{flex:1;max-width:300px;border:4px solid var(--navy);border-radius:20px;background:#FFF3D1;box-shadow:5px 5px 0 var(--navy);padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.frame.future{opacity:.35}
.frame .props{font-size:40px;line-height:1}
.frame .q{font-size:15px;font-weight:700;text-align:center}
.frame .lab{font:800 14px var(--head);background:#fff;border:2px solid var(--navy);border-radius:999px;padding:2px 10px}
.frame.shows{background:#FFFFFF;border-color:#9AA2BA;border-style:dashed}
.frame.feels{background:#2B335A;color:#fff}
.frame.feels .q{color:#fff}
.ghost{filter:grayscale(1) brightness(1.6);opacity:.55;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{filter:grayscale(1) brightness(2.1) drop-shadow(0 0 10px #fff);opacity:.8}}
.maskbadge{position:absolute;top:8px;right:10px;font-size:30px}
.alt{position:relative}
.alt .b{position:absolute;inset:0;animation:alt 2.4s steps(1) infinite}
@keyframes alt{0%{opacity:0}50%{opacity:1}}
.steam{position:absolute;top:-6px;left:50%;font-size:34px;animation:steam 1.2s ease-in-out infinite}
@keyframes steam{0%{transform:translate(-50%,0);opacity:.2}50%{opacity:1}100%{transform:translate(-50%,-28px);opacity:0}}
.casetxt{font-size:17px;font-weight:600;line-height:1.4;max-width:900px;text-align:left}

/* сейф */
.safe{flex:1;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;min-height:0}
.safeL{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center}
.ft{width:84px;height:84px;border:4px solid var(--navy);border-radius:20px;background:#fff;display:grid;place-items:center;font-size:48px}
.ft.empty{border-style:dashed;background:rgba(255,255,255,.5)}
.ft.hint{background:#D7F5E6;border-color:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.legend{display:flex;flex-direction:column;gap:7px;font-size:17px;font-weight:600;background:#fff;border:3px solid var(--navy);border-radius:16px;padding:8px 14px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:26px;height:26px;border-radius:6px;border:2px solid var(--navy);display:inline-block}
.fb-g{background:var(--green) !important}.fb-y{background:var(--yellow) !important}.fb-x{background:#B9C0CF !important}
.history{background:var(--soft);border:3px solid var(--navy);border-radius:22px;padding:12px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;min-height:0}
.hrow{display:flex;align-items:center;gap:8px}
.hrow .ft{width:54px;height:54px;font-size:30px;border-width:3px;border-radius:14px}

/* крамниця */
.shop{flex:1;display:grid;grid-template-columns:200px minmax(0,1.5fr) minmax(0,1fr);gap:18px;min-height:0;align-items:start}
.owl{display:flex;flex-direction:column;align-items:center;gap:8px}
.owl .speech{font-size:16px;padding:8px 12px}
.goods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
.goods.g4{grid-template-columns:repeat(4,1fr)}
.good{border:3px solid var(--navy);border-radius:16px;background:#fff;box-shadow:4px 4px 0 var(--navy);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.good .e{font-size:46px}.good .n{font-size:16px;font-weight:700;line-height:1.2}
.price{white-space:nowrap;font:800 16px var(--head);background:var(--yellow);border:2px solid var(--navy);border-radius:999px;padding:1px 9px}
.good.taken{opacity:.3}
.coinrow{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE28A,var(--yellow) 60%,#E8A915);border:2px solid var(--navy);display:inline-block}
.bigcoin{display:inline-grid;place-items:center;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE28A,var(--yellow) 60%,#E8A915);border:4px solid var(--navy);box-shadow:3px 3px 0 var(--navy);font:800 24px var(--head)}
.basket{background:var(--soft);border:3px dashed var(--navy);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px}
.cartline{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--navy);border-radius:12px;padding:5px 10px;font-weight:700;font-size:16px}
.plate{min-height:110px;background:#fff;border:4px solid var(--navy);border-radius:50%/40%;box-shadow:5px 5px 0 var(--navy);display:flex;flex-wrap:wrap;gap:6px;align-content:center;justify-content:center;padding:14px 36px;width:min(520px,100%)}
.plate .bigcoin{width:58px;height:58px;font-size:22px;border-width:3px}
.display{min-width:220px;font:800 56px var(--head);background:#fff;border:4px solid var(--navy);border-radius:18px;padding:4px 18px;text-align:center;min-height:62px}
.opts{display:flex;gap:22px;justify-content:center}
.opt{min-width:280px;font:700 28px var(--head);padding:26px;border:4px solid var(--navy);border-radius:20px;background:#fff;box-shadow:5px 5px 0 var(--navy)}

/* похід */
.items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.item{border:3px solid var(--navy);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--navy);padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden}
.item .e{font-size:28px;flex:none}
.item.in{opacity:.3}
.pack{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:#FFE6B0;border:4px solid var(--navy);border-radius:22px;padding:10px;box-shadow:5px 5px 0 var(--navy)}
.pocket{height:58px;border:3px dashed var(--navy);border-radius:14px;display:grid;place-items:center;font-size:30px;background:rgba(255,255,255,.5)}
.routes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.route{border:4px solid var(--navy);border-radius:20px;background:#fff;box-shadow:5px 5px 0 var(--navy);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.route .e{font-size:44px}.route .nm{font:700 16px var(--head)}
.danger{background:#FFE7A8;border:2px solid var(--navy);border-radius:8px;padding:2px 8px;font-weight:800;font-size:13px}
.plan{flex:1;display:grid;grid-template-columns:auto minmax(0,1fr) 250px;gap:16px;min-height:0}
.pool{display:flex;flex-direction:column;gap:8px;min-width:250px}
.task-card{border:3px solid var(--navy);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--navy);padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;white-space:nowrap}
.task-card .e{font-size:28px}
.tl{position:relative;display:grid;grid-template-rows:repeat(12,1fr);height:100%;min-height:0}
.tl .r{display:grid;grid-template-columns:62px 1fr;align-items:start}
.tl .h{font:800 14px var(--head);line-height:1;transform:translateY(-1px)}
.tl .r .line{border-top:2px dashed rgba(30,42,90,.25);height:100%}
.blk{position:absolute;left:66px;right:0;border:3px solid var(--navy);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--navy);display:flex;align-items:center;gap:10px;padding:0 12px;font-weight:700;font-size:17px;z-index:2;white-space:nowrap;overflow:hidden}
.blk .e{font-size:26px}
.blk.rainzone{background:repeating-linear-gradient(45deg,#DDE8F7,#DDE8F7 8px,#fff 8px,#fff 16px);border-style:dashed;box-shadow:none;z-index:1;color:var(--muted)}
.rules{font-size:16px;line-height:1.55;font-weight:600;height:100%}

/* Боб */
.bob{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:center;min-height:0}
.bobfig{position:relative}
.rope{position:absolute;bottom:16%;right:-18%}
.walkoff{animation:walkoff 2.2s steps(12) forwards}
@keyframes walkoff{to{transform:translateX(700px)}}
.inv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:10px}
.icard{background:#fff;border:3px solid var(--navy);border-radius:16px;box-shadow:4px 4px 0 var(--navy);padding:8px 10px;display:flex;align-items:center;gap:10px;min-width:0}
.icard .e{font-size:34px;line-height:1;flex:none}
.icard b{display:block;font-size:16px;line-height:1.2}
.icard small{display:block;font-size:13px;font-weight:600;color:var(--muted);line-height:1.25}
.icard.used{opacity:.35}
.icard.given{outline:5px solid var(--yellow);outline-offset:2px}
.bubbles{display:flex;flex-direction:column;gap:8px}
.bubbles .me{align-self:flex-end;background:#EEEBFF;border:3px solid var(--navy);border-radius:16px;padding:6px 12px;font-weight:700}

/* майданчик */
.kids{display:flex;gap:40px;justify-content:center;align-items:flex-end}
.kid{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.wish{background:#fff;border:3px solid var(--navy);border-radius:16px;padding:6px 12px;font-weight:700;font-size:18px;box-shadow:3px 3px 0 var(--navy);max-width:230px}
.think{position:absolute;top:-28px;left:50%;transform:translateX(-50%);font:800 24px var(--head);letter-spacing:4px;animation:think 1.5s steps(3) infinite}
@keyframes think{0%{opacity:.3}50%{opacity:1}}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.rcard{border:3px solid var(--navy);border-radius:16px;background:#fff;box-shadow:4px 4px 0 var(--navy);padding:12px;font-weight:700;font-size:18px;text-align:center}
.teams{display:flex;justify-content:space-around;gap:20px;width:100%}
.team{display:flex;flex-direction:column;align-items:center;gap:4px}
.chat{flex:1;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;background:#E6EEF9;border:4px solid var(--navy);border-radius:22px;padding:10px 14px;min-height:0;width:100%}
.chat .ttl{font:800 15px var(--head);display:flex;gap:8px;align-items:center}
.msgs{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;overflow:hidden}
.msg{max-width:70%;background:#fff;border:2px solid var(--navy);border-radius:14px 14px 14px 4px;padding:6px 12px;font-size:18px;font-weight:600}
.msg b{display:block;font-size:13px;color:var(--muted)}
.msg.me{align-self:flex-end;background:#DCF8C6;border-radius:14px 14px 4px 14px}
.replies{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reply{background:#fff;border:3px solid var(--navy);border-radius:14px;box-shadow:3px 3px 0 var(--navy);padding:10px 14px;font-weight:700;font-size:18px;text-align:left}

/* радіо */
.onair{display:inline-flex;align-items:center;gap:8px;background:#C8323C;color:#fff;border:3px solid var(--navy);border-radius:12px;padding:4px 14px;font:800 16px var(--head);box-shadow:3px 3px 0 var(--navy)}
.onair i{width:12px;height:12px;border-radius:50%;background:#fff;animation:lamp 1s steps(1) infinite}
@keyframes lamp{50%{opacity:.2}}
.guest{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.plate-name{font:800 18px var(--head);background:#fff;border:3px solid var(--navy);border-radius:10px;padding:3px 14px;box-shadow:3px 3px 0 var(--navy);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mic{position:absolute;right:-30px;bottom:40%;font-size:40px}
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%}

/* фінал */
.battery{display:flex;gap:6px;border:4px solid var(--navy);border-radius:12px;padding:6px;background:#fff;position:relative}
.battery::after{content:"";position:absolute;right:-12px;top:50%;width:8px;height:24px;transform:translateY(-50%);background:var(--navy);border-radius:0 4px 4px 0}
.battery i{width:70px;height:46px;border:3px solid var(--navy);border-radius:6px;background:#fff}
.battery i.on{background:var(--yellow)}
.selfgrid{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-content:center;min-height:0}
.scard{background:#fff;border:3px solid var(--navy);border-radius:18px;box-shadow:4px 4px 0 var(--navy);padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.scard .hd{display:flex;align-items:center;gap:8px;font:800 15px/1.2 var(--head)}
.scard .ic{display:grid;place-items:center;width:38px;height:38px;border:3px solid var(--navy);border-radius:12px;background:var(--yellow);font-size:20px;flex:none}
.scard .qq{font-size:14px;font-weight:600;line-height:1.3;color:var(--muted);flex:1}
.scard.cur{outline:5px solid var(--purple);outline-offset:3px;background:#F4F1FF}
.scard.off{opacity:.4}
.mini{display:flex;gap:4px;border:3px solid var(--navy);border-radius:8px;padding:3px;background:#fff;position:relative}
.mini::after{content:"";position:absolute;right:-8px;top:50%;width:5px;height:14px;transform:translateY(-50%);background:var(--navy);border-radius:0 3px 3px 0}
.mini i{width:30px;height:22px;border:2px solid var(--navy);border-radius:4px;background:#fff}
.mini i.on{background:var(--yellow)}
.final{flex:1;display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;justify-content:center}
.final .huge{color:var(--purple)}
@media (max-width:1180px){.main{grid-template-columns:170px minmax(0,1fr);gap:12px;padding:4px 12px 12px}.task .q{font-size:19px}.task .sit{font-size:16px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><b>✨</b><span>Острів суперсил</span></div><nav class="prog" id="prog"></nav></header>
  <main class="main">
    <aside class="aside">
      <div class="iskra"><div class="iskra-face"><div class="spark" id="spark"></div>Іскра</div><div class="bubble" id="bubble"></div></div>
      <div class="herocard" id="herocard"></div>
    </aside>
    <section class="stage" id="stage"></section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="hero-pixel.js"></script>
<script src="core.js"></script>
<script>
/* ВІКНО ГРИ: лише відображає стан, який надсилає пульт. Жодних кнопок і текстів для МІКа. */
const HP = window.HeroPixel, $ = q => document.querySelector(q);
let S = null, lastFx = null, lastBubble = '', walkFrom = null;
const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = s => tplG(s, S && S.setup.gender);
const G = () => S.setup.group;

/* ---------- звук ---------- */
const AUD = { ctx: null,
  ensure() { try { if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ctx = new AC(); } if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; } catch (e) { return null; } },
  tone(f, d, type = 'sine', v = 0.06, delay = 0) { if (!S || !S.sound) return; const c = this.ensure(); if (!c) return; try { const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.05); } catch (e) { } },
  item() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, 'triangle', 0.06, i * 0.08)); },
  soft() { this.tone(880, 0.12, 'sine', 0.05); }, timer() { this.tone(523, 0.25); this.tone(392, 0.4, 'sine', 0.06, 0.22); }
};
document.addEventListener('pointerdown', () => AUD.ensure());

/* ---------- спрайти ---------- */
function hero(opts, scale, cls = '') {
  const o = Object.assign({ style: CONFIG.heroStyle, head: S.hero.head || 'fox', cape: capeColor(S.hero.cape), items: S.items, scale }, opts);
  if (reduced()) return `<div class="px ${cls}">${HP.render(o)}</div>`;
  return `<div class="px sway ${cls}">${HP.render(o)}<div class="blink">${HP.render(Object.assign({}, o, { blink: true, pop: undefined }))}</div></div>`;
}
function npc(head, cape, scale, expression, extra = {}, cls = '') {
  return `<div class="px ${cls}">${HP.render(Object.assign({ style: CONFIG.heroStyle, head, cape, items: [], scale, expression }, extra))}</div>`;
}
function emoFace(head, chosen, scale, cape) {
  const c = cape || '#9AA2BA';
  if (!chosen || !chosen.length) return npc(head, c, scale, 'blank');
  if (chosen.length === 1 || reduced()) return npc(head, c, scale, chosen[0]);
  return `<div class="alt">${npc(head, c, scale, chosen[0])}<div class="b">${npc(head, c, scale, chosen[1])}</div></div>`;
}
const otherCapes = () => CONFIG.capes.map(c => c.color).filter(c => c !== capeColor(S.hero.cape));
const otherHeads = list => list.filter(h => h !== S.hero.head);
// гра «намальована» для 1280×800 і пропорційно масштабується під вікно (у Google Meet — під показану вкладку)
let LOGIC_H = 800;
function fit() {
  const z = Math.min(innerWidth / 1280, innerHeight / 800);
  LOGIC_H = Math.round(innerHeight / z);
  const r = document.documentElement.style;
  r.setProperty('--z', z); r.setProperty('--W', Math.round(innerWidth / z) + 'px'); r.setProperty('--H', LOGIC_H + 'px');
}
fit();
const vh = () => LOGIC_H;
const sc = (reserve, H = 30) => Math.max(2, Math.min(10, Math.floor((vh() - reserve) / H)));

/* ---------- ефекти ---------- */
function confetti(n = 40) {
  if (reduced()) return;
  const box = document.createElement('div'); box.className = 'confetti'; const cols = ['#FFC93C', '#6C4DFF', '#FF5A5F', '#3D8BFF', '#2EC4B6', '#FF9F1C'];
  for (let i = 0; i < n; i++) { const p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = cols[i % cols.length]; p.style.animationDelay = Math.random() * 0.5 + 's'; p.style.setProperty('--dx', (Math.random() * 220 - 110) + 'px'); p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg'); box.appendChild(p); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3000);
}
function toast(t) { const st = $('#stage'); st.querySelectorAll('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = T(t); st.appendChild(d); emojify(d); setTimeout(() => d.remove(), 2000); }
function playFx(f) {
  if (!f || f.kind === '') return;
  if (f.kind === 'item') { AUD.item(); confetti(30); }
  else if (f.kind === 'crown') { AUD.item(); confetti(80); }
  else if (f.kind === 'open') { AUD.item(); confetti(24); }
  else if (f.kind === 'toast') toast(f.data);
  else if (f.kind === 'timer') AUD.timer();
  else AUD.soft();
}

/* ---------- верх, Іскра, герой ---------- */
function renderChrome() {
  $('#prog').innerHTML = CONFIG.skills.map(sk => { const s = S && S.st[sk.key]; const L = CONFIG.locations[sk.key];
    return `<div class="dot${s && s.done ? ' done' : ''}${S && S.cur === sk.key && S.phase === 'lesson' ? ' cur' : ''}">${L.icon}</div>`; }).join('');
  const sp = $('#spark');
  if (!sp.dataset.ok) { sp.innerHTML = HP.renderSpark({ scale: 4 }) + `<div class="f2">${HP.renderSpark({ scale: 4, frame: 1 })}</div>`; sp.dataset.ok = 1; }
  const hc = $('#herocard');
  if (!S || !S.hero.head) { hc.innerHTML = `<div style="font-size:60px;line-height:1.3">🏝️</div><div class="hname">${S && S.setup.name ? esc(S.setup.name) : 'Острів суперсил'}</div>`; return; }
  const popItem = S.fx && S.fx.kind === 'item' && Date.now() - S.fx.at < 2500 ? S.fx.data.item : undefined;
  hc.innerHTML = hero({ pop: popItem }, Math.max(3, Math.min(6, Math.floor((hc.clientWidth - 20) / 24)))) + `<div class="hname">${esc(S.setup.name || 'Герой')}</div>`;
}
function setBubble(t) {
  const b = $('#bubble'); t = T(t || '');
  if (t !== lastBubble) { b.textContent = t; b.classList.remove('say'); void b.offsetWidth; b.classList.add('say'); lastBubble = t; }
}
function iskraLine() {
  if (!S || S.phase === 'setup') return CONFIG.iskra.idle;
  const key = S.cur, s = S.st[key]; if (!s) return '';
  if (key === 'hero') return CONFIG.iskra.hero;
  if (key === 'final') return CONFIG.iskra.final[s.step] || '';
  if (s.step === 'intro') return CONFIG.iskra.intro;
  if (s.step === 'done') return CONFIG.iskra.done;
  if (key === 'radio' && s.step === 'q' && typeof s.answers[s.qi] === 'number') return 'Дякую! Наступне питання…';
  if (key === 'safe' && s.locks && s.locks[s.lock] && s.locks[s.lock].opened) return CONFIG.iskra.safe.opened;
  return (CONFIG.iskra[key] || {})[s.step] || '';
}
// ситуація + питання для поточного кроку (екран дитини): { sit, q }
function taskText() {
  if (!S || S.phase === 'setup') return null;
  const key = S.cur, s = S.st[key]; if (!s) return null;
  const g = G(), Tk = CONFIG.task, v = {};
  const out = (t, vars) => { t = pick78(t, g); if (!t) return null; if (typeof t === 'string') t = { sit: '', q: t }; return { sit: fill(pick78(t.sit, g) || '', vars || v), q: fill(pick78(t.q, g) || '', vars || v) }; };
  if (key === 'hero') return out(Tk.hero.pick);
  if (s.step === 'done') return out(Tk.done);
  if (s.step === 'intro') return { sit: CONFIG.lore[key] || '', q: Tk.intro[key] || '' };
  if (key === 'final') { const k = s.list && s.list[s.bi]; v.selfQ = k ? skillOf(k).selfQ : ''; return out(Tk.final[s.step]); }
  const c = ctxOf(S, key);
  if (key === 'emotions' && s.step === 'frames') { const f = emFrames(c)[s.fi] || {}; v.sit = f.sit || f.text || ''; v.q = f.q || f.question || ''; }
  if (key === 'safe') { const L = s.lock === 0 ? c.C.warm : c.C.hard; v.slots = L.slots; v.n = L.fruits.length; if (s.locks && s.locks[s.lock] && s.locks[s.lock].opened) return out(Tk.safe.opened); }
  if (key === 'money' && s.step === 'exact') { const t = c.C.targets[s.t] || {}; v.sit = t.sit || ''; v.q = t.q || ''; }
  if (key === 'money' && s.step === 'deal') { const d = c.C.deals[s.q] || {}; v.sit = d.sit || ''; v.q = d.q || d.text || ''; }
  if (key === 'playground' && s.step === 'chat') { const m = c.C.chat.messages[s.ci] || {}; v.sit = m.sit || ''; }
  if (key === 'radio') { v.guest = guestName(s); if (s.step === 'q') { const Q = c.C.questions[s.qi] || {}; v.sit = Q.sit || ''; v.q = fill(Q.q || '', { guest: v.guest }); } }
  if (key === 'bob') return out(Tk.bob[s.line] || Tk.bob.hello);
  return out((Tk[key] || {})[s.step]);
}

/* ---------- мапа ---------- */
function islandSVG() {
  const pts = CONFIG.order.map(k => CONFIG.locations[k]);
  return `<svg class="isl" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <rect width="100" height="100" fill="#7FC8F8"/>
    <path d="M6 82 C 2 50, 18 18, 48 8 C 78 0, 98 22, 96 52 C 95 80, 74 96, 46 95 C 22 94, 9 92, 6 82 Z" fill="#FFE6A8" stroke="#1E2A5A" stroke-width=".6"/>
    <path d="M12 78 C 10 52, 24 26, 48 16 C 74 8, 90 28, 89 52 C 88 76, 70 88, 46 88 C 26 88, 14 86, 12 78 Z" fill="#9BE07A"/>
    <polyline points="${pts.map(p => p.x + ',' + p.y).join(' ')}" fill="none" stroke="#1E2A5A" stroke-width=".7" stroke-dasharray="1.6 1.4" stroke-linecap="round"/>
    <circle cx="30" cy="38" r="3" fill="#5BBF5B"/><circle cx="58" cy="70" r="3.4" fill="#5BBF5B"/><circle cx="78" cy="20" r="2.6" fill="#5BBF5B"/>
  </svg>`;
}
function mapView(opts = {}) {
  const locs = CONFIG.order.filter(k => k !== 'final' || opts.all).map(k => {
    const L = CONFIG.locations[k], s = S.st[k], done = s && s.done && k !== S.cur, cur = k === S.cur;
    return `<div class="loc${done ? ' done' : ''}${cur ? ' cur' : ''}" style="left:${L.x}%;top:${L.y}%"><div class="ic">${L.icon}</div><div class="nm">${esc(L.name)}</div>${done ? '<span class="star">⭐</span>' : ''}</div>`;
  }).join('');
  const L = CONFIG.locations[S.cur], from = walkFrom ? CONFIG.locations[walkFrom] : L;
  const w = S.hero.head ? `<div class="walker" id="walker" style="left:${from.x}%;top:${from.y - 3}%">${hero({}, 3)}</div>` : '';
  return `<div class="map">${islandSVG()}${locs}${w}${opts.extra || ''}</div>`;
}
function head(sk, title, timer) {
  const L = CONFIG.locations[sk];
  const t = taskText();   // ситуація + питання — одразу під заголовком сцени
  const task = t && (t.sit || t.q) ? `<div class="task" id="task">${t.sit ? `<div class="sit">${esc(T(t.sit))}</div>` : ''}${t.q ? `<div class="q">${esc(T(t.q))}</div>` : ''}</div>` : '';
  return `<div class="shead"><span class="sicon">${L.icon}</span><div><div class="kicker">${esc(L.name)}</div><h2>${esc(title)}</h2></div>${timer ? `<div class="timer" id="timer" data-ends="${timer}">${fmtTime(Math.ceil((timer - Date.now()) / 1000))}</div>` : ''}</div>${task}`;
}

/* ---------- сцени станцій ---------- */
const V = {};
V.hero = () => `${head('hero', 'Хто твій герой?')}<div class="center" style="flex-direction:row;gap:40px">
  <div class="card">${hero({}, sc(400, 30))}</div>
  <div style="display:flex;flex-direction:column;gap:22px"><div class="row">${CONFIG.heroes.map(h => `<div class="tile${S.hero.head === h.id ? ' sel' : ''}" style="padding:6px">${HP.renderHead(h.id, 4)}</div>`).join('')}</div>
  <div class="row">${CONFIG.capes.map(c => `<div class="tile${S.hero.cape === c.id ? ' sel' : ''}" style="width:62px;height:62px;border-radius:50%;background:${c.color}"></div>`).join('')}</div></div></div>`;
V.intro = key => {
  const L = CONFIG.locations[key];
  return head(key, L.name) + mapView({ extra: `<div class="splash" style="width:auto"><div class="bigic">${L.icon}</div><div class="huge" style="font-size:26px">${esc(L.name)}</div></div>` });
};
V.done = key => {
  const it = CONFIG.costume[key], s = S.st[key];
  return head(key, s.skipped ? 'Переходимо далі!' : 'Локацію пройдено!') + `<div class="center">${hero({ pop: it }, sc(440, 30), 'jump')}
    <div class="huge" style="font-size:28px">Новий предмет: ${esc(HP.ITEMS[it])}!</div></div>`;
};
V.emotions = s => {
  const ctx = ctxOf(S, 'emotions'), F = emFrames(ctx), f = F[s.fi];
  if (s.step === 'caseIntro') {
    const h = f.heads[f.who];
    return head('emotions', f.title) + `<div class="center"><div class="strip" style="max-width:640px">
      <div class="frame shows"><span class="maskbadge">🎭</span>${npc(h, '#FFB703', sc(470, 30), 'joy')}<span class="lab">Показує іншим</span></div>
      <div class="frame feels">${npc(h, '#FFB703', sc(470, 30), 'blank', {}, 'ghost')}<span class="lab" style="color:var(--navy)">Насправді</span></div></div></div>`;
  }
  if (s.step === 'frames') {
    if (G() === '78') {
      const comicFrames = F.map((x, i) => ({ x, i })).filter(o => o.x.ci === f.ci);
      return head('emotions', f.title) + `<div class="center"><div class="strip">${comicFrames.map(({ x, i }) =>
        `<div class="frame${i === s.fi ? ' sel' : ''}${i > s.fi ? ' future' : ''}"><div class="props">${x.props}</div>${emoFace(x.head, s.ans[i], sc(520, 30), '#FFB703')}<div class="pill">${x.fi + 1}</div></div>`).join('')}</div></div>`;
    }
    const caseFrames = F.map((x, i) => ({ x, i })).filter(o => o.x.ci === f.ci);
    const fr = ({ x, i }) => {
      const hd = x.heads[x.who], big = sc(560, 30);
      if (x.kind === 'shows') return `<div class="frame shows${i === s.fi ? ' sel' : ''}" style="max-width:360px"><span class="maskbadge">🎭</span>${npc(hd, '#FFB703', big, 'joy')}<span class="lab">Показує іншим</span></div>`;
      if (x.kind === 'feels') { const ch = s.ans[i]; return `<div class="frame feels${i === s.fi ? ' sel' : ''}${i > s.fi ? ' future' : ''}" style="max-width:360px">${ch && ch.length ? emoFace(hd, ch, big, '#FFB703') : npc(hd, '#FFB703', big, 'blank', {}, 'ghost')}<span class="lab" style="color:var(--navy)">Насправді</span></div>`; }
      return `<div class="frame${i === s.fi ? ' sel' : ''}${i > s.fi ? ' future' : ''}" style="max-width:360px">${emoFace(hd, s.ans[i], big, '#FFB703')}<div class="q">${esc(T(x.q || x.question))}</div></div>`;
    };
    return head('emotions', f.title) + `<div class="center" style="gap:10px"><div class="strip">${caseFrames.map(fr).join('')}</div></div>`;
  }
  // «Що допоможе?» — без таймера на екрані дитини
  const h = ctx.C.calmHead;
  const sparks = Array.from({ length: s.calm.n }, (_, i) => { const a = i * 2.4, r = 30 + (i % 4) * 6; const x = 50 + Math.cos(a) * r * 1.2, y = 50 + Math.sin(a) * r; return `<span class="flysp${i === s.calm.n - 1 ? ' new' : ''}" style="left:${x}%;top:${y}%;--fx:${(50 - x) * 4}px;--fy:${(50 - y) * 4}px">✨</span>`; }).join('');
  return head('emotions', 'Що допоможе?') + `<div class="center" style="position:relative">${sparks}<div style="position:relative"><span class="steam">💨</span>${npc(h, '#FF5A5F', sc(380, 30), 'anger')}</div></div>`;
};
V.safe = s => {
  const ctx = ctxOf(S, 'safe'), L = s.lock === 0 ? ctx.C.warm : ctx.C.hard, lk = s.locks[s.lock];
  const legend = '<div class="legend"><span><i class="fb-g"></i> зелений — фрукт на своєму місці</span><span><i class="fb-y"></i> жовтий — є в коді, але в іншому місці</span><span><i class="fb-x"></i> сірий — такого фрукта в коді немає</span></div>';
  const hist = atts => atts.map((a, k) => `<div class="hrow"><b style="width:22px">${k + 1}</b>${a.guess.map((f, i) => `<div class="ft ${({ green: 'fb-g', yellow: 'fb-y', grey: 'fb-x' })[a.fb[i]]}">${f}</div>`).join('')}</div>`).join('');
  if (lk && lk.opened) return head('safe', s.lock === 0 ? 'Розминка' : 'Складніший замок') + `<div class="center"><div style="font-size:96px;line-height:1">🔓</div><div class="huge">Замок відкрито!</div></div>`;
  const guess = Array.from({ length: L.slots }, (_, i) => lk.hint && lk.hint.pos === i ? `<div class="ft hint">${lk.hint.fruit}</div>` : s.guess[i] ? `<div class="ft">${s.guess[i]}</div>` : '<div class="ft empty"></div>').join('');
  // зверху вниз: ряд фруктів → слоти поточної спроби → легенда кольорів (унизу)
  return head('safe', s.lock === 0 ? 'Замок 1 · розминка' : 'Замок 2 · складніший') + `<div class="safe"><div class="safeL" style="justify-content:flex-start">
    <div class="row">${L.fruits.map(f => `<div class="ft" style="box-shadow:3px 3px 0 var(--navy)">${f}</div>`).join('')}</div>
    <div class="pill" style="font-size:16px;margin-top:6px">Спроба · у коді ${L.slots} ${pl(L.slots, ['місце', 'місця', 'місць'])}</div>
    <div class="row" style="flex-wrap:nowrap">${guess}</div>
    <div style="margin-top:auto">${legend}</div></div><div class="history"><div class="kicker" style="font-size:15px">Твої спроби</div>${hist(lk.attempts) || '<div class="muted" style="font-weight:600">Тут з’являтимуться твої спроби й підказки кольорами</div>'}</div></div>`;
};
V.money = s => {
  const ctx = ctxOf(S, 'money'), C = ctx.C, owlL = C.owl.lines;
  const coins = n => `<div class="coinrow">${'<i class="coin"></i>'.repeat(Math.max(0, n))}</div>`;
  const owl = line => `<div class="owl">${line ? `<div class="speech">${esc(T(line))}</div>` : ''}${npc('owl', '#8B5A2B', sc(560, 30))}<b>Сова Ухта</b></div>`;
  if (s.step === 'picnic') {
    if (G() === '78') {
      const left = C.budget - ST.money.spent(s, C, '78');
      return head('money', 'Пікнік за 10 монет') + `<div class="shop">${owl(owlL.hello)}<div class="goods">${C.goods.map(g => `<div class="good${s.cart.includes(g.id) ? ' taken' : ''}"><span class="e">${g.e}</span><span class="n">${esc(g.name)}</span><span class="price">${g.price} ${coinSVG(2)}</span></div>`).join('')}</div>
        <div class="basket"><b>Гаманець</b>${coins(left)}<b>Кошик</b><div class="row">${s.cart.map(id => `<span style="font-size:36px">${C.goods.find(x => x.id === id).e}</span>`).join('')}</div></div></div>`;
    }
    const left = C.budget - ST.money.spent(s, C, '910');
    return head('money', 'Пікнік за 60 грн') + `<div class="shop">${owl(owlL.hello)}<div class="goods g4">${C.goods.map(g => `<div class="good"><span class="e">${g.e}</span><span class="n">${esc(g.name)}</span><span class="price">${g.price} грн</span></div>`).join('')}</div>
      <div class="basket"><b>Залишок: <span class="pill">${left} грн</span> з ${C.budget}</b><b>Кошик</b>${Object.entries(s.cart).map(([id, n]) => { const g = C.goods.find(x => x.id === id); return `<div class="cartline"><span style="font-size:22px">${g.e}</span>${esc(g.name)} × ${n}</div>`; }).join('')}</div></div>`;
  }
  if (s.step === 'exactIntro') return head('money', 'Без решти') + `<div class="center" style="flex-direction:row;gap:30px">${owl(owlL.register)}<div style="font-size:90px">🧾💥</div></div>`;
  if (s.step === 'exact') {
    const t = C.targets[s.t];
    const owlLine = s.owl === 'give' ? owlL.give : s.owl === 'thanks' ? owlL.thanks : '';
    return head('money', `Покупка ${s.t + 1} з ${C.targets.length}`) + `<div class="shop" style="grid-template-columns:150px minmax(0,1fr) 220px;align-items:center">${owl(owlLine)}
      <div class="center" style="gap:14px"><div class="card" style="display:flex;align-items:center;gap:14px"><span style="font-size:64px">${t.e}</span><div style="text-align:left"><div style="font:700 19px var(--head)">${esc(t.name)}</div><span class="price" style="font-size:20px">${t.sum} ${coinSVG(3)}</span></div></div>
        <div class="row">${C.coins.map(v => `<span class="bigcoin">${v}</span>`).join('')}</div>
        <div class="plate">${s.plate.map(v => `<span class="bigcoin">${v}</span>`).join('') || '<span class="muted">Тарілочка для монет</span>'}</div></div>
      <div class="basket"><b>Кошик</b><div class="row" style="font-size:44px">${s.basket.join(' ')}</div></div></div>`;
  }
  const D = C.deals[s.q];
  const body = D.type === 'choice' ? `<div class="opts">${D.opts.map(o => `<div class="opt${s.choice === o.id ? ' sel' : ''}">${esc(o.label)}</div>`).join('')}</div>` : `<div class="display">${esc(s.typed) || '&nbsp;'}</div><div class="lead">грн</div>`;
  return head('money', `Що вигідніше? · ${s.q + 1} з ${C.deals.length}`) + `<div class="center" style="flex-direction:row;gap:30px">${owl(owlL.deal)}<div class="center">${body}</div></div>`;
};
V.hike = s => {
  const ctx = ctxOf(S, 'hike'), C = ctx.C;
  if (G() === '78') {
    if (s.step === 'pack') return head('hike', 'Рюкзак') + `<div class="center" style="gap:12px"><div class="pill" style="font-size:20px">${C.forecast.e} ${esc(C.forecast.text)}</div>
      <div class="items">${C.items.map(i => `<div class="item${s.pack.includes(i.id) ? ' in' : ''}"><span class="e">${i.e}</span>${esc(i.name)}</div>`).join('')}</div>
      <div class="pack" style="width:min(620px,100%)">${Array.from({ length: C.pockets }, (_, k) => `<div class="pocket">${s.pack[k] ? C.items.find(i => i.id === s.pack[k]).e : ''}</div>`).join('')}</div></div>`;
    return head('hike', 'Зламаний міст') + `<div class="center" style="gap:14px"><div class="row" style="align-items:center"><span style="font-size:50px">${C.obstacle.e}</span><span class="pill" style="font-size:18px">До темряви: ${'☀️'.repeat(C.sunsLeft)}</span></div>
      <div class="routes" style="width:100%">${C.routes.map(r => `<div class="route${s.route === r.id ? ' sel' : ''}"><span class="e">${r.e}</span><span class="nm">${esc(r.name)}</span><span style="font-size:22px">${'☀️'.repeat(r.suns)}</span>${r.danger ? `<span class="danger">⚠️ ${esc(r.note.replace(/^Знак /, ''))}</span>` : ''}</div>`).join('')}</div></div>`;
  }
  if (s.step === 'rain') return head('hike', 'Несподіванка') + `<div class="center"><div style="font-size:90px">🌧️⚡</div><div class="huge" style="font-size:28px">${esc(C.rain.text)}</div></div>`;
  const pool = C.blocks.filter(b => s.plan[b.id] === undefined), n = C.hours.length + 1, pct = h => ((h - C.hours[0]) / n * 100);
  const rows = C.hours.concat([C.end]).map(h => `<div class="r"><span class="h">${String(h).padStart(2, '0')}:00</span><span class="line"></span></div>`).join('');
  const blocks = C.blocks.filter(b => s.plan[b.id] !== undefined).map(b => `<div class="blk${s.sel === b.id ? ' sel' : ''}" style="top:calc(${pct(s.plan[b.id])}% + 2px);height:calc(${b.dur / n * 100}% - 4px)"><span class="e">${b.e}</span>${esc(b.name)} · ${b.dur} год</div>`).join('');
  const rain = s.step === 'replan' ? `<div class="blk rainzone" style="top:calc(${pct(C.rain.at)}% + 2px);height:calc(${(C.rain.until - C.rain.at) / n * 100}% - 4px)">🌧️ ${esc(C.blocks.find(b => b.id === 'peak').name)}: закрито</div>` : '';
  const rules = Object.values(C.rules).concat(s.step === 'replan' ? [C.rain.rule] : []);
  return head('hike', s.step === 'replan' ? 'Новий план' : 'Розклад походу') + `<div class="plan">
    <div class="pool"><div class="kicker">Справи</div>${pool.map(b => `<div class="task-card${s.sel === b.id ? ' sel' : ''}"><span class="e">${b.e}</span>${esc(b.name)} · ${b.dur} год</div>`).join('')}</div>
    <div class="tl">${rows}${rain}${blocks}</div>
    <div class="card rules"><div class="kicker">Правила</div><ul style="margin:6px 0 0;padding-left:18px">${rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div></div>`;
};
V.bob = s => {
  const ctx = ctxOf(S, 'bob'), C = ctx.C, face = s.face === 'normal' ? undefined : s.face;   // оригінальний бобер із hero-pixel.js
  const walking = s.left && s.step === 'bye';
  const bob = `<div class="bobfig${walking ? ' walkoff' : ''}"><div class="px">${HP.render({ style: CONFIG.heroStyle, head: 'beaver', cape: '#FF9F1C', items: [], scale: sc(560, 30), expression: face, frame: walking ? 1 : 0 })}</div>${!s.result && !s.left ? `<div class="rope">${ropeSVG(Math.max(3, sc(560, 30) - 1))}</div>` : ''}</div>`;
  const line = T(ST.bob.lineText(s, C));
  const lastMine = s.tries.length ? C.items.find(i => i.id === s.tries[s.tries.length - 1]) : null;
  const given = s.result ? s.tries[s.tries.length - 1] : '';
  const invTitle = s.step === 'talk' ? '🎒 Здається, у твоєму рюкзаку є дещо цікаве…' : '🎒 Твій рюкзак';
  const inv = `<div class="kicker" style="font-size:15px;margin-top:10px">${invTitle}</div><div class="inv" style="margin-top:6px">${C.items.map(i => `<div class="icard${s.tries.includes(i.id) && i.id !== given ? ' used' : ''}${i.id === given ? ' given' : ''}"><span class="e">${i.e}</span><div><b>${esc(i.name)}</b><small>${esc(T(i.note || ''))}</small></div></div>`).join('')}</div>`;
  return head('bob', 'Ринок Боба') + `<div class="bob"><div class="center">${bob}</div><div class="bubbles">${lastMine ? `<div class="me">Ти: ${lastMine.e} ${esc(lastMine.name)}</div>` : ''}<div class="speech"><span style="font-size:13px;color:var(--muted);display:block">Боб</span>${esc(line)}</div></div></div>${inv}`;
};
V.playground = s => {
  const ctx = ctxOf(S, 'playground'), C = ctx.C, caps = otherCapes();
  if (G() === '78') {
    const [h1, h2] = otherHeads(C.heads);
    if (s.step === 'judge') return head('playground', 'Суддя') + `<div class="center"><div style="font-size:44px">${C.judge.props}</div><div class="kids">
      <div class="kid"><div class="wish">${esc(C.judge.mia)}</div>${npc(h1, caps[0], sc(470, 30), 'anger')}<b>Мія</b></div>
      <div class="kid"><div class="wish">${esc(C.judge.tim)}</div>${npc(h2, caps[1], sc(470, 30), 'anger')}<b>Тім</b></div></div></div>`;
    return head('playground', 'Правила') + `<div class="center" style="gap:14px"><div class="kids">${[[h1, caps[0], 'Мія'], [h2, caps[1], 'Тім']].map(([h, c, n]) => `<div class="kid"><span class="think">…</span>${npc(h, c, 4)}<b>${n}</b></div>`).join('')}</div>
      <div class="cards">${C.cards.map(c => `<div class="rcard${s.cards.includes(c.id) ? ' sel' : ''}">${esc(c.text)}</div>`).join('')}</div></div>`;
  }
  if (s.step === 'compromise') {
    const team = (key, h) => `<div class="team"><b>${esc(C.teams[key].name)}</b><div class="row">${[0, 1, 2].map(i => npc(h, caps[i % caps.length], 5)).join('')}</div><div class="row">${C.teams[key].wishes.map(w => `<span class="wish">${esc(w)}</span>`).join('')}</div></div>`;
    return head('playground', 'Компроміс') + `<div class="center" style="gap:12px"><div class="teams">${team('cats', 'cat')}${team('foxes', 'fox')}</div>
      <div class="cards">${C.cards.map(c => `<div class="rcard${s.cards.includes(c.id) ? ' sel' : ''}">${esc(c.text)}</div>`).join('')}</div></div>`;
  }
  // «Чат класу»
  const ch = C.chat, msgs = [];
  msgs.push(`<div class="msg"><b>Класна керівниця</b>${esc(ch.situation)}</div>`);
  ch.messages.forEach((m, i) => {
    if (i > s.ci) return;
    msgs.push(`<div class="msg"><b>${esc(m.from)}</b>${esc(m.text)}</div>`);
    const pick = s.chat[i];
    if (pick) { const o = m.options.find(x => x.id === pick), r = m.react[pick]; msgs.push(`<div class="msg me"><b>Ти</b>${esc(o.text)}</div>`, `<div class="msg"><b>${esc(r.from)}</b>${esc(r.text)}</div>`); }
  });
  const cur = ch.messages[s.ci];
  const replies = s.step === 'chat' && cur ? `<div class="replies">${cur.options.map(o => `<div class="reply">${esc(o.text)}</div>`).join('')}</div>` : '';
  return head('playground', 'Чат класу') + `<div class="chat"><div class="ttl">💬 ${esc(ch.title)}</div><div class="msgs">${msgs.slice(-7).join('')}</div>${replies}</div>`;
};
V.radio = s => {
  const ctx = ctxOf(S, 'radio'), C = ctx.C;
  const named = s.guestMode === 'named';
  const host = named
    ? `<div class="guest"><div class="px">${HP.render({ style: CONFIG.heroStyle, head: 'shadow', cape: CONFIG.capes[s.guestCape || 0].color, items: [0, 4], scale: sc(500, 30) })}</div><span class="mic">🎙️</span><div class="plate-name">${esc(s.guest)}</div></div>`
    : `<div class="guest"><div class="px">${HP.renderSpark({ scale: Math.max(5, Math.min(10, Math.floor((vh() - 460) / 14))), mic: true })}</div><div class="plate-name">Іскра</div></div>`;
  if (s.step === 'guest') return head('radio', 'Таємний гість') + `<div class="center"><span class="onair"><i></i> В ЕФІРІ</span>${s.guestMode ? host : `<div class="px">${HP.render({ style: CONFIG.heroStyle, head: 'shadow', cape: '#9AA2BA', items: [0, 4], scale: sc(500, 30) })}</div><div class="plate-name">?</div>`}</div>`;
  if (s.step === 'q' || s.step === 'ask') return head('radio', s.step === 'q' ? `Питання ${s.qi + 1} з ${C.questions.length}` : 'Твоє питання') + `<div class="center"><span class="onair"><i></i> В ЕФІРІ</span>${host}</div>`;
  return head('radio', 'Думка за 30 секунд', s.running ? s.endsAt : null) + `<div class="center" style="gap:16px"><span class="onair"><i></i> В ЕФІРІ</span><div class="topics">${C.topics.map((t, i) => `<div class="rcard${s.topic === i ? ' sel' : ''}" style="font-size:20px;padding:20px">${esc(t)}</div>`).join('')}</div></div>`;
};
V.final = s => {
  if (s.step === 'batteries') {
    // усі батарейки на одному екрані; поточна картка підсвічена
    const cur = s.list[s.bi];
    const cards = CONFIG.skills.map(sk => { const k = sk.key, on = s.list.includes(k), v = S.self[k] || 0;
      return `<div class="scard${k === cur ? ' cur' : ''}${on ? '' : ' off'}"><div class="hd"><span class="ic">${CONFIG.locations[k].icon}</span>${esc(sk.area)}</div><div class="qq">${on ? esc(T(selfShort(sk))) : 'Станцію пропущено'}</div>${on ? `<div class="mini">${[1, 2, 3].map(n => `<i class="${v >= n ? 'on' : ''}"></i>`).join('')}</div>` : ''}</div>`; }).join('');
    return head('final', 'Батарейки суперсил') + `<div class="selfgrid">${cards}</div>`;
  }
  const L = scoreAll(S), sk = skillOf(titleSkill(S, L));
  return head('final', 'Острів пройдено!') + `<div class="final">${hero({}, sc(400, 30))}<div style="display:flex;flex-direction:column;gap:16px">
    <div class="lead">${esc(S.setup.name)}, ти пройш{ов|ла} увесь острів!</div><div class="kicker" style="font-size:16px">Твоя найяскравіша суперсила</div><div class="huge">${esc(sk.title)}</div></div></div>`;
};
function splashIdle() {
  return `<div class="center"><div style="font-size:120px;line-height:1">🏝️</div><div class="huge">Острів суперсил</div><div class="lead muted">Скоро вирушаємо!</div></div>`;
}

/* ---------- рендер ---------- */
function render() {
  renderChrome();
  const st = $('#stage');
  let html;
  if (!S || S.phase === 'setup') html = splashIdle();
  else {
    const key = S.cur, s = S.st[key];
    if (!s) html = splashIdle();
    else if (key === 'hero') html = V.hero(s);
    else if (key === 'final') html = V.final(s);
    else if (s.step === 'intro') html = V.intro(key);
    else if (s.step === 'done') html = V.done(key);
    else html = V[key](s);
  }
  st.innerHTML = T(html);
  const sh = st.querySelector(':scope > .shead');
  if (sh) { const fl = document.createElement('div'); fl.className = 'sflow'; while (sh.nextSibling) fl.appendChild(sh.nextSibling); st.appendChild(fl); }
  setBubble(iskraLine());
  emojify(st); emojify($('#prog')); emojify($('#herocard')); emojify($('#bubble'));
  const w = $('#walker');
  if (w && walkFrom) { const L = CONFIG.locations[S.cur]; requestAnimationFrame(() => requestAnimationFrame(() => { w.style.left = L.x + '%'; w.style.top = (L.y - 3) + '%'; })); setTimeout(() => { walkFrom = null; }, 1400); }
  tick();
}
function tick() {
  const el = $('#timer'); if (!el) return;
  const rem = (+el.dataset.ends - Date.now()) / 1000;
  el.textContent = fmtTime(Math.ceil(Math.max(0, rem))); el.classList.toggle('pulse', rem <= 10 && rem > 0);
}
function onState(ns) {
  if (!ns || ns.v !== 5) return;
  if (S && ns.rev && S.rev && ns.rev < S.rev) return;
  const fxNew = ns.fx && (!lastFx || ns.fx.n !== lastFx);
  if (S && ns.cur !== S.cur && ns.fx && ns.fx.kind === 'walk' && !reduced()) walkFrom = S.cur;
  S = ns;
  render();
  if (fxNew && lastFx !== null) playFx(ns.fx);
  lastFx = ns.fx ? ns.fx.n : 0;
}
emojify(document.querySelector('.brand'));
SYNC.init('game', m => { if (m && m.type === 'state') onState(m.state); });
const saved = SYNC.load(); if (saved) { lastFx = saved.fx ? saved.fx.n : 0; onState(saved); } else render();
SYNC.hello();
setInterval(() => SYNC.ping(), 1000);
setInterval(tick, 250);
window.addEventListener('resize', () => { fit(); render(); });
</script>
</body>
</html>
