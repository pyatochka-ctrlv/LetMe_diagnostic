<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Майстерня суперсил</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E2A5A; --sky:#CDE6FF; --yellow:#FFC93C; --purple:#6C4DFF; --green:#1F9D63;
  --paper:#FFFDF6; --soft:#EEF6FF; --grey:#C3CAD9; --muted:#5B6690;
  --head:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --text:'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--navy);font-family:var(--text);overflow:hidden;
  background-image:radial-gradient(rgba(30,42,90,.07) 2px, transparent 2px);background-size:26px 26px}
body[data-screen="report"]{overflow:auto;background-image:none}
button{font-family:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15}
.app{height:100vh;display:grid;grid-template-rows:58px minmax(0,1fr) auto}
body[data-screen="report"] .app{display:none}
#report{display:none}
body[data-screen="report"] #report{display:block}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;padding:8px 18px}
.brand{font-family:var(--head);font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand b{display:inline-grid;place-items:center;width:34px;height:34px;border:3px solid var(--navy);border-radius:12px;background:var(--yellow);box-shadow:3px 3px 0 var(--navy);font-size:18px}
.map{margin:0 auto;display:flex;gap:12px;position:relative;align-items:center}
.map::before{content:"";position:absolute;left:18px;right:18px;top:50%;border-top:3px dashed rgba(30,42,90,.35);z-index:0}
.dot{position:relative;z-index:1;width:40px;height:40px;border:3px solid var(--navy);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:19px;box-shadow:3px 3px 0 var(--navy);opacity:.5;filter:grayscale(.6)}
.dot.done{background:var(--yellow);opacity:1;filter:none}
.dot.cur{opacity:1;filter:none;outline:4px solid var(--purple);outline-offset:3px}
.iconbtn{width:42px;height:42px;border:3px solid var(--navy);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--navy);font-size:19px;cursor:pointer}
.iconbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--navy)}

/* ---------- main ---------- */
.main{display:grid;grid-template-columns:212px minmax(0,1fr);gap:18px;padding:4px 18px 12px;min-height:0}
.aside{display:flex;flex-direction:column;gap:12px;min-height:0}
.iskra{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.iskra-face{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:700;font-size:14px}
.iskra-face span{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--yellow);border:3px solid var(--navy);box-shadow:3px 3px 0 var(--navy);font-size:24px}
.bubble{position:relative;background:#fff;border:3px solid var(--navy);border-radius:18px;box-shadow:4px 4px 0 var(--navy);padding:10px 12px;font-size:15px;line-height:1.35;font-weight:500}
.bubble::before{content:"";position:absolute;left:16px;top:-11px;width:16px;height:16px;background:#fff;border-left:3px solid var(--navy);border-top:3px solid var(--navy);transform:rotate(45deg)}
.bubble.say{animation:say .45s ease}
@keyframes say{0%{transform:scale(.9);opacity:.3}100%{transform:none;opacity:1}}
.herocard{margin-top:auto;background:#fff;border:4px solid var(--navy);border-radius:24px;box-shadow:6px 6px 0 var(--navy);padding:6px 8px 8px;text-align:center}
.px svg{display:block;margin:0 auto;image-rendering:pixelated}
.herocard .hname{font-family:var(--head);font-size:13px;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px svg .pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}

.stage{position:relative;background:var(--paper);border:5px solid var(--navy);border-radius:30px;box-shadow:9px 9px 0 var(--navy);padding:14px 22px 16px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.shead{display:flex;align-items:center;gap:14px;margin-bottom:10px;min-height:52px}
.sicon{display:grid;place-items:center;width:50px;height:50px;border:4px solid var(--navy);border-radius:16px;background:var(--yellow);box-shadow:4px 4px 0 var(--navy);font-size:26px;flex:none}
.kicker{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.shead h2{font-size:22px}
.sbody{flex:1;min-height:0;display:flex;flex-direction:column}
.timer{margin-left:auto;background:var(--yellow);border:4px solid var(--navy);border-radius:999px;padding:4px 22px;font:800 28px/1.2 var(--head);box-shadow:5px 5px 0 var(--navy);min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.timer.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* ---------- teacher panel ---------- */
.teacher{display:flex;align-items:center;gap:10px;padding:8px 18px;background:rgba(255,255,255,.6);border-top:2px dashed rgba(30,42,90,.3);min-height:58px}
.tlabel{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);white-space:nowrap}
#tactions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1;min-width:0}
.tb{font:600 14px/1 var(--text);padding:9px 14px;border:2px solid var(--navy);border-radius:12px;background:#fff;box-shadow:2px 2px 0 var(--navy);cursor:pointer;white-space:nowrap}
.tb:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--navy)}
.tb.primary{background:var(--navy);color:#fff}
.tb.small{padding:6px 9px;font-size:18px;line-height:1}
.tb:disabled{opacity:.4;cursor:not-allowed;transform:none}
.tb.arm{background:#FFE7A8}
.thint{font-size:13px;color:var(--muted)}
#treset .tb{font-size:13px;color:var(--muted);border-color:rgba(30,42,90,.5);box-shadow:none}
#treset .tb.arm{color:var(--navy);border-color:var(--navy)}

/* ---------- common child elements ---------- */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;min-height:0}
.card{background:#fff;border:4px solid var(--navy);border-radius:24px;box-shadow:6px 6px 0 var(--navy);padding:16px 20px}
.big{font:700 22px/1.15 var(--head);padding:16px 24px;border:4px solid var(--navy);border-radius:22px;background:#fff;box-shadow:6px 6px 0 var(--navy);cursor:pointer;transition:transform .08s}
.big:active,.pick:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--navy)}
.sel{outline:5px solid var(--purple) !important;outline-offset:3px}
.lead{font-size:22px;font-weight:600;line-height:1.35;max-width:760px}
.huge{font-family:var(--head);font-size:40px;font-weight:800}
.muted{color:var(--muted)}
.pill{display:inline-block;background:var(--yellow);border:3px solid var(--navy);border-radius:999px;padding:4px 14px;font-weight:800;font-size:14px;box-shadow:3px 3px 0 var(--navy)}
.lbl{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:var(--yellow);border:4px solid var(--navy);border-radius:18px;box-shadow:5px 5px 0 var(--navy);padding:10px 22px;font:700 20px var(--head);z-index:20;animation:toast 1.9s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* setup */
.setup{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;align-content:center}
.setup .card{padding:12px 18px}
.setup .opt{font-size:13px;font-weight:600;color:var(--muted)}
.setup .card{display:flex;flex-direction:column;gap:12px}
.setup h3{font-size:18px}
.nameinput{font:600 22px var(--text);padding:9px 14px;border:4px solid var(--navy);border-radius:18px;box-shadow:inset 3px 3px 0 rgba(30,42,90,.12);width:100%;color:var(--navy);background:var(--soft)}
.nameinput:focus{outline:5px solid var(--purple);outline-offset:2px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.groupbtn{flex:1;font-size:28px;padding:12px 10px}
.groupbtn small{display:block;font:600 15px var(--text);margin-top:6px}
.agebtn{flex:1;font-size:26px;padding:12px 16px}
.genbtn{flex:1;font-size:19px;padding:13px 12px}
.setup .wide{grid-column:1/-1}

/* hero creation */
.herobuild{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:center;min-height:0}
.herobuild .preview{background:#fff;border:4px solid var(--navy);border-radius:28px;box-shadow:7px 7px 0 var(--navy);padding:14px}
.herobuild .preview{display:grid;place-items:center}
.animals{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.pick{aspect-ratio:1;padding:0;border:4px solid var(--navy);border-radius:22px;background:#fff;box-shadow:5px 5px 0 var(--navy);cursor:pointer;display:grid;place-items:center}
.capes{display:flex;gap:16px}
.capebtn{width:66px;height:66px;border-radius:50%;border:4px solid var(--navy);box-shadow:4px 4px 0 var(--navy);cursor:pointer}

/* station done */

/* attention */
.att{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:0}
.findbar{display:flex;align-items:center;gap:14px;font-size:20px;font-weight:700}
.findbar .em{font-size:30px}
.grid{--cell:min(calc((100vh - 345px - (var(--n) - 1) * 8px) / var(--n)), 84px);display:grid;grid-template-columns:repeat(var(--n), var(--cell));gap:8px}
.cell{position:relative;width:var(--cell);height:var(--cell);border:3px solid var(--navy);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--navy);font-size:calc(var(--cell) * .52);display:grid;place-items:center;cursor:pointer;padding:0;line-height:1}
.cell .num{position:absolute;left:4px;top:2px;font:700 12px var(--text);color:var(--muted)}
.cell.marked{outline:5px solid var(--purple);outline-offset:-1px;background:#F1EDFF}
.rulecard{display:flex;gap:26px;align-items:stretch;justify-content:center}
.rulecard .card{min-width:240px}
.rulecard .em{font-size:64px;line-height:1.1}
.newrule{background:var(--purple);color:#fff;border-color:var(--navy)}

/* memory */
.tiles{display:grid;gap:14px;justify-content:center}
.tile{width:min(108px, calc((100vh - 360px) / 2.6));aspect-ratio:1;border:4px solid var(--navy);border-radius:22px;background:#fff;box-shadow:5px 5px 0 var(--navy);font-size:min(56px, calc((100vh - 360px) / 5));display:grid;place-items:center;transition:transform .12s, background .12s;padding:0}
.tile:disabled{cursor:default}
.tile[data-act]{cursor:pointer}
.tile.lit{background:var(--yellow);transform:scale(1.14);box-shadow:0 0 0 8px rgba(255,201,60,.55),5px 5px 0 var(--navy)}
.tiles.dim .tile{opacity:.55}
.slots{display:flex;gap:10px;justify-content:center;min-height:72px}
.slot{width:66px;height:66px;border:3px dashed var(--navy);border-radius:16px;display:grid;place-items:center;font-size:36px;background:rgba(255,255,255,.6)}
.slot.f{border-style:solid;background:#fff;outline:4px solid var(--purple);outline-offset:2px}
.items{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;max-width:820px}
.item{width:min(110px, calc((100vh - 330px) / 2.4));aspect-ratio:1;border:4px solid var(--navy);border-radius:24px;background:#fff;box-shadow:5px 5px 0 var(--navy);display:grid;place-items:center;font-size:min(60px, calc((100vh - 330px) / 4.4))}
.blink{flex:1;display:grid;place-items:center;font-size:80px;animation:blinkk .5s ease}
@keyframes blinkk{0%{opacity:0}50%{opacity:1}100%{opacity:.2}}

/* planning */
.pack{flex:1;display:grid;grid-template-columns:210px minmax(0,1fr) 260px;gap:20px;align-items:center;min-height:0}
.schedule{display:flex;flex-direction:column;gap:8px;font-size:17px;font-weight:600}
.schedule .srow{display:flex;align-items:center;gap:10px}
.schedule .srow span{font-size:30px}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.thing{border:3px solid var(--navy);border-radius:18px;background:#fff;box-shadow:4px 4px 0 var(--navy);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:min(104px, calc((100vh - 330px) / 3.3))}
.thing .e{font-size:min(46px, calc((100vh - 330px) / 8))}
.thing .n{font-size:13px;font-weight:600;line-height:1.15;text-align:center}
.thing.empty{border-style:dashed;background:transparent;box-shadow:none;cursor:default;opacity:.35}
.bag{position:relative;background:#FFE6B0;border:5px solid var(--navy);border-radius:40px 40px 30px 30px;box-shadow:7px 7px 0 var(--navy);padding:44px 12px 14px;min-height:min(380px, calc(100vh - 340px));display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;justify-content:center}
.bag::before{content:"🎒 Рюкзак";position:absolute;top:10px;left:0;right:0;text-align:center;font:700 16px var(--head)}
.bag .thing{width:72px;min-height:0;padding:6px 2px}
.bag .thing .e{font-size:30px}
.bag .thing .n{font-size:10px}
.fly{animation:fly .5s cubic-bezier(.2,.8,.3,1.2)}
@keyframes fly{0%{transform:translate(-160px,-30px) scale(.5) rotate(-25deg);opacity:.3}100%{transform:none;opacity:1}}
.morning{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px}
.cards{display:flex;gap:14px;justify-content:center;min-height:140px}
.mcard{width:126px;border:4px solid var(--navy);border-radius:20px;background:#fff;box-shadow:5px 5px 0 var(--navy);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:15px}
.mcard .e{font-size:46px}
.mslots{display:flex;gap:10px;justify-content:center;align-items:center}
.mslot{width:132px;min-height:150px;border:3px dashed var(--navy);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px;background:rgba(255,255,255,.5)}
.mslot .no{font:800 18px var(--head);margin-bottom:4px}
.mslot .mcard{width:100%;box-shadow:3px 3px 0 var(--navy);outline:4px solid var(--purple);outline-offset:1px}
.arrow{font-size:22px;color:var(--muted)}
.eve{flex:1;display:grid;grid-template-columns:220px 1fr 270px;gap:22px;align-items:start;min-height:0}
.pool{display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:10px;border:3px solid var(--navy);border-radius:16px;background:#fff;box-shadow:4px 4px 0 var(--navy);padding:8px 12px;font-weight:700;font-size:16px;cursor:pointer;text-align:left}
.task .e{font-size:28px}
.timeline{display:flex;flex-direction:column;gap:7px}
.hour{display:flex;align-items:center;gap:14px;border:3px solid var(--navy);border-radius:16px;background:#fff;padding:0 14px;height:min(56px, calc((100vh - 360px) / 7));font-size:17px;font-weight:700;cursor:pointer;text-align:left;width:100%}
.hour .t{font:800 17px var(--head);width:64px}
.hour.empty{border-style:dashed;background:rgba(255,255,255,.5);color:var(--muted);font-weight:600}
.hour.fixed{background:#E4E8F5;cursor:default}
.hour.filled{box-shadow:3px 3px 0 var(--navy);outline:4px solid var(--purple);outline-offset:1px}
.hour .e{font-size:26px}
.rules ul{margin:0;padding-left:20px;font-size:16px;line-height:1.55;font-weight:500}
.surprise{font-size:64px}
.banner{background:var(--yellow);border:3px solid var(--navy);border-radius:14px;padding:6px 12px;font-weight:700;margin-bottom:10px;font-size:15px}

/* emotions */
.situ{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:center;min-height:0}
.situ .card{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.situ .pic{font-size:min(110px, calc((100vh - 330px) / 3.3));line-height:1.1}
.situ .txt{font-size:22px;font-weight:600;line-height:1.35}
.emogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.emogrid.w4{grid-template-columns:repeat(2,1fr)}
.emo{font:700 19px/1.1 var(--head);padding:12px 10px;border:4px solid var(--navy);border-radius:18px;background:#fff;box-shadow:5px 5px 0 var(--navy);cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:center}
.emo .e{font-size:36px}
.emo.sel{background:#F1EDFF}
.need2{font-weight:800;font-size:17px;color:var(--purple)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--navy);background:#fff}
.dots i.on{background:var(--navy)}

/* money */
.shop{flex:1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:stretch;min-height:0}
.goods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start}
.goods.g4{grid-template-columns:repeat(4,1fr)}
.good{position:relative;border:3px solid var(--navy);border-radius:18px;background:#fff;box-shadow:4px 4px 0 var(--navy);padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.good .e{font-size:min(44px, calc((100vh - 330px) / 8))}
.good .n{font-size:14px;font-weight:600;text-align:center;line-height:1.15}
.price{font:800 15px var(--head);background:var(--yellow);border:2px solid var(--navy);border-radius:999px;padding:2px 10px}
.good.taken{opacity:.35}
.basket{display:flex;flex-direction:column;gap:10px}
.wallet{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;flex-wrap:wrap}
.coins{display:flex;flex-wrap:wrap;gap:4px}
.mini{width:24px;height:24px;border-radius:50%;background:var(--yellow);border:2px solid var(--navy);display:inline-block}
.cart{flex:1;background:var(--soft);border:3px dashed var(--navy);border-radius:20px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:120px}
.cart .good{width:96px;padding:6px 4px;outline:4px solid var(--purple);outline-offset:1px}
.cart .good .e{font-size:30px}
.cartline{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--navy);border-radius:14px;padding:6px 10px;font-weight:700;font-size:16px;cursor:pointer;width:100%;outline:4px solid var(--purple);outline-offset:1px;text-align:left}
.cartline .e{font-size:24px}
.cartline .x{margin-left:auto;font:800 15px var(--head)}
.coin{width:min(110px, calc((100vh - 360px) / 3.2));aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%, #FFE28A, var(--yellow) 60%, #E8A915);border:5px solid var(--navy);box-shadow:5px 5px 0 var(--navy);font:800 38px var(--head);cursor:pointer;display:grid;place-items:center}
.coin.c5{width:min(128px, calc((100vh - 360px) / 2.8))}
.plate{min-height:min(170px, calc((100vh - 360px) / 2));background:#fff;border:4px solid var(--navy);border-radius:50%/40%;box-shadow:6px 6px 0 var(--navy);display:flex;flex-wrap:wrap;gap:8px;align-content:center;justify-content:center;padding:18px 40px;width:min(560px, 100%)}
.plate .coin{width:58px;font-size:22px;border-width:3px;box-shadow:2px 2px 0 var(--navy)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.key{height:min(60px, calc((100vh - 380px) / 4.6));border:3px solid var(--navy);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--navy);font:800 24px var(--head);cursor:pointer}
.display{min-width:180px;font:800 46px var(--head);background:#fff;border:4px solid var(--navy);border-radius:18px;padding:6px 18px;text-align:center;min-height:72px}
.opts{display:flex;gap:26px;justify-content:center}
.opts .big{min-width:250px;font-size:26px;padding:26px 24px}

/* creativity */
.creat{flex:1;position:relative;display:grid;place-items:center;min-height:0}
.prompt{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;z-index:1}
.prompt .obj{font-size:min(150px, calc((100vh - 360px) / 2.3));line-height:1}
.prompt svg{width:min(380px, calc((100vh - 360px) * 1.2));height:auto;background:#fff;border:4px solid var(--navy);border-radius:24px;box-shadow:6px 6px 0 var(--navy)}
.spark{position:absolute;font-size:30px;pointer-events:none}
.spark.fly{animation:sparkfly .8s ease-out}
@keyframes sparkfly{0%{transform:translate(var(--fx),var(--fy)) scale(.2);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}

/* safe */
.safe{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;min-height:0}
.safeL{display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center}
.lockhead{font:800 22px var(--head)}
.guess{display:flex;gap:12px}
.ft{width:min(78px, calc((100vh - 340px) / 5));aspect-ratio:1;border:4px solid var(--navy);border-radius:18px;background:#fff;display:grid;place-items:center;font-size:min(44px, calc((100vh - 340px) / 9))}
.ft.empty{border-style:dashed;background:rgba(255,255,255,.5)}
.ft.hint{background:#D7F5E6;border-color:var(--green)}
.fruits{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fruit{width:min(76px, calc((100vh - 340px) / 5.2));aspect-ratio:1;border:4px solid var(--navy);border-radius:20px;background:#fff;box-shadow:4px 4px 0 var(--navy);font-size:min(42px, calc((100vh - 340px) / 9.5));cursor:pointer;display:grid;place-items:center}
.legend{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600;background:#fff;border:3px solid var(--navy);border-radius:16px;padding:8px 14px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:22px;height:22px;border-radius:6px;border:2px solid var(--navy);display:inline-block}
.fb-g{background:var(--green) !important}
.fb-y{background:var(--yellow) !important}
.fb-x{background:#B9C0CF !important}
.history{background:var(--soft);border:3px solid var(--navy);border-radius:22px;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.hrow{display:flex;align-items:center;gap:8px}
.hrow .no{font:700 13px var(--head);color:var(--muted);width:24px}
.hrow .ft{width:48px;font-size:28px;border-width:3px;border-radius:12px}
.hsep{font:700 14px var(--head);color:var(--muted);margin-top:4px}

/* battery */
.bats{flex:1;display:grid;grid-template-rows:repeat(7,1fr);gap:7px;min-height:0}
.bat{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;background:#fff;border:3px solid var(--navy);border-radius:16px;box-shadow:3px 3px 0 var(--navy);padding:0 14px}
.bat .e{font-size:28px}
.bat .t{font-weight:800;font-size:17px}
.bat .t small{display:block;font-weight:500;font-size:14px;color:var(--muted)}
.cells{display:flex;align-items:center;gap:5px;border:3px solid var(--navy);border-radius:10px;padding:4px;position:relative;margin-right:10px}
.cells::after{content:"";position:absolute;right:-10px;top:50%;width:6px;height:16px;transform:translateY(-50%);background:var(--navy);border-radius:0 4px 4px 0}
.seg{width:60px;height:min(34px, calc((100vh - 400px) / 9));border:2px solid var(--navy);border-radius:6px;background:#fff;cursor:pointer}
.seg.on{background:var(--yellow)}

/* final */
.final{flex:1;display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;justify-content:center;min-height:0}
.final svg{width:min(300px, calc(100vh - 330px));height:auto}
.final .huge{font-size:44px;color:var(--purple)}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.2s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--dx), 105vh) rotate(var(--rot));opacity:.9}}

/* ---------- teacher extras ---------- */
.tb.skip{font-size:13px;color:var(--muted);border-color:rgba(30,42,90,.45);box-shadow:none;background:transparent}
.tb.arm,.tb.skip.arm{background:#FFE7A8;color:var(--navy);border-color:var(--navy)}
.tb.hintbtn{font-size:16px;padding:7px 10px}
.tb.hintbtn.on{background:var(--yellow)}
#tinfo{font-size:12px;color:var(--muted);white-space:nowrap}
#tmenu{position:relative}
.menu{position:absolute;right:0;bottom:calc(100% + 8px);background:#fff;border:2px solid var(--navy);border-radius:14px;box-shadow:3px 3px 0 var(--navy);padding:8px;display:flex;flex-direction:column;gap:6px;z-index:30;min-width:230px}
.popover{position:fixed;left:18px;bottom:70px;max-width:540px;background:#fff;border:2px solid var(--navy);border-radius:14px;box-shadow:3px 3px 0 var(--navy);padding:10px 14px;font-size:14px;line-height:1.45;z-index:30}
.popover .ttl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.popover ul{margin:0;padding-left:18px}
.popover li{margin:2px 0}

/* ---------- report (окремий стриманий стиль) ---------- */
body[data-screen="report"]{background:#fff}
#report{background:#fff;min-height:100vh}
.rp{max-width:900px;margin:0 auto;padding:36px 28px 60px;font-family:var(--text);color:var(--navy);font-size:15px;line-height:1.55}
.rp h1{font-family:var(--head);font-size:28px;font-weight:700;margin:4px 0 14px}
.rp h2{font-family:var(--text);font-size:18px;font-weight:800;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid #D5DAE6}
.rp h3{font-family:var(--text);font-size:16px;font-weight:700;margin:0}
.rp-brand{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B7393}
.rp-meta{display:flex;flex-wrap:wrap;gap:8px 30px;margin:0;padding:12px 0;border-top:2px solid var(--navy);border-bottom:1px solid #D5DAE6}
.rp-meta div{display:flex;flex-direction:column}
.rp-meta dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#6B7393;font-weight:700}
.rp-meta dd{margin:0;font-weight:600}
.rp section{margin-top:26px}
.rp .keep{break-inside:avoid}
.rp p{margin:0 0 8px}
.rp ul{margin:4px 0 8px;padding-left:20px}
.rp li{margin:2px 0}
.rp-summary p{font-size:16px}
.rp-profile{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
.rp table{width:100%;border-collapse:collapse;font-size:13.5px}
.rp th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6B7393;font-weight:700;border-bottom:1px solid var(--navy);padding:6px}
.rp td{border-bottom:1px solid #E3E7F0;padding:7px 6px;vertical-align:top}
.rp td.nm{font-weight:700}
.rp tr{break-inside:avoid}
.lv{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.lv1{background:#EEEBFF;color:#4B36C9}.lv2{background:#C9BEFF;color:#2A1C8A}.lv3{background:#6C4DFF;color:#fff}.lv0{background:#F1F2F6;color:#6B7393}
.dots3{letter-spacing:1px;white-space:nowrap;color:#6C4DFF}
.rp-legend{display:flex;gap:16px;font-size:12.5px;color:#4A5378;margin-top:6px;flex-wrap:wrap;align-items:center}
.rp-skill{border-top:1px solid #E3E7F0;padding:12px 0;break-inside:avoid}
.rp-skill .hd{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.rp-skill dl{display:grid;grid-template-columns:180px minmax(0,1fr);gap:4px 14px;margin:6px 0 0;font-size:14px}
.rp-skill dt{color:#6B7393;font-weight:600}
.rp-skill dd{margin:0}
.rp-skill dd ul{margin:0;padding-left:18px}
.rp .muted,.rp-note{color:#6B7393}
.rp-note{font-size:12.5px}
.rp-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid #D5DAE6;align-items:center}
.rp-actions .tb{box-shadow:none;border-width:1.5px;font-size:14px;padding:10px 16px}
.radar{width:100%;height:auto;display:block}

@media (max-width:1180px){
  .main{grid-template-columns:176px minmax(0,1fr);gap:14px;padding:4px 14px 10px}
  .stage{padding:12px 16px 14px}
  .bubble{font-size:14px}
  .pack{grid-template-columns:170px minmax(0,1fr) 200px;gap:12px}
  .thing .n{font-size:12px;overflow-wrap:anywhere}
  .eve{grid-template-columns:200px 1fr 240px;gap:16px}
  .mcard{width:104px}
  .mslot{width:92px;min-height:136px}
  .mslot .mcard{font-size:13px}
  .mslot .mcard .e{font-size:36px}
  .mslots{gap:5px}
  .arrow{font-size:15px}
  .herobuild{grid-template-columns:230px minmax(0,1fr);gap:20px}
  .animals{gap:10px}
  .brand span{display:none}
  .opts .big{min-width:210px}
  #tinfo{display:none}
}
@media (max-width:820px){ .rp-profile{grid-template-columns:1fr} .rp-skill dl{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
@media print{
  @page{size:A4;margin:12mm 13mm}
  body,body[data-screen="report"]{background:#fff !important;overflow:visible}
  .app,.no-print,.confetti,.popover{display:none !important}
  #report{display:block !important;min-height:0}
  .rp{max-width:none;padding:0;font-size:9.6pt;line-height:1.38}
  .rp h1{font-size:17pt;margin:2px 0 8px}
  .rp h2{font-size:11.5pt;margin-bottom:5px;padding-bottom:3px}
  .rp h3{font-size:10pt}
  .rp section{margin-top:12px}
  .rp-summary p{font-size:10pt}
  .rp-profile{gap:12px}
  .rp table{font-size:8.4pt}
  .rp td{padding:3px 4px}
  .rp th{padding:3px 4px;font-size:7.5pt}
  .rp-skills{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
  .rp-profile{grid-template-columns:150px minmax(0,1fr) !important}
  .rp-summary p{margin-bottom:0}
  .rp .keep{break-inside:auto}
  .rp tr,.rp li,.rp-skill,.rp p{break-inside:avoid}
  .rp-profile table{font-size:7.9pt}
  .rp-profile td{padding:2px 4px;line-height:1.3}
  .rp-skill{padding:6px 0}
  .rp h2{break-after:avoid}
  .rp-profile{grid-template-columns:170px minmax(0,1fr)}
  .rp-skill dl{display:block;font-size:8.5pt;margin-top:2px}
  .rp-skill dt{display:inline;font-weight:700;color:var(--navy)}
  .rp-skill dt::after{content:': '}
  .rp-skill dd{display:inline}
  .rp-skill dd::after{content:'';display:block;margin-bottom:1px}
  .rp-skill dd ul{display:block;margin:0;padding-left:14px}
  .rp-skill .hd{margin-bottom:1px}
  .rp ul{margin:2px 0 4px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

const $ = (q, r = document) => r.querySelector(q);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rnd(n) { return Math.floor(Math.random() * n); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function ceilAvg(...xs) { const v = xs.reduce((a, b) => a + b, 0) / xs.length; return Math.ceil(v - 1e-9); }
// середнє лише з наявних рівнів (null — пропущено); якщо нічого немає → null
function ceilAvgN(...xs) { const v = xs.filter(x => typeof x === 'number'); return v.length ? ceilAvg(...v) : null; }
function th(v, l3, l2) { return v >= l3 ? 3 : v >= l2 ? 2 : 1; }
function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function num(x) { return String(Math.round(x * 100) / 100).replace('.', ','); }
function pl(n, f) { const a = Math.abs(n) % 100, b = a % 10; return f[(a > 10 && a < 20) ? 2 : b === 1 ? 0 : (b >= 2 && b <= 4) ? 1 : 2]; }
function C(key) { const c = CONFIG.stations[key]; return Object.assign({}, c, c[S.group] || {}); }
function skillOf(key) { return CONFIG.skills.find(s => s.key === key); }
// Рід: «мрія{в|ла}» → «мріяв» / «мріяла» (частина в дужках замінює закінчення)
function tplG(str, gender) { return String(str ?? '').replace(/\{([^{}|]*)\|([^{}|]*)\}/g, (_, m, f) => (gender === 'f' ? f : m)); }
function tpl(str) { return tplG(str, S && S.gender); }
function tb(act, label, o = {}) {
  return `<button class="tb${o.primary ? ' primary' : ''}${o.cls ? ' ' + o.cls : ''}" data-act="${act}"${o.arg !== undefined ? ` data-arg="${esc(o.arg)}"` : ''}${o.disabled ? ' disabled' : ''}${o.title ? ` title="${esc(o.title)}"` : ''}>${label}</button>`;
}

}

  ensure() {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ctx = new AC(); }

/* =====================================================================

   ===================================================================== */
// Wordle: спершу зелені, потім жовті з урахуванням кількості
function wordle(guess, code) {
  const n = code.length, res = Array(n).fill('grey'), left = {};
  for (let i = 0; i < n; i++) { if (guess[i] === code[i]) res[i] = 'green'; else left[code[i]] = (left[code[i]] || 0) + 1; }
  for (let i = 0; i < n; i++) { if (res[i] !== 'green' && left[guess[i]] > 0) { res[i] = 'yellow'; left[guess[i]]--; } }
  return res;
}
// Ранок героя: кількість порушень
function morningViolations(order) {
  let v = 0; const i = id => order.indexOf(id);
  if (order[0] !== 'wake') v++;
  if (order[order.length - 1] !== 'leave') v++;
  const s = i('shoes'), d = i('dress'), l = i('leave');
  if (!(s > -1 && d > -1 && l > -1 && s > d && s < l)) v++;
  return v;
}
// Вечір: список порушених правил. slots = {годину: idСправи}
function eveningBroken(slots) {
  const at = id => { for (const h in slots) if (slots[h] === id) return +h; return null; };
  const dog = at('dog'), hw = at('hw'), games = at('games'), bag = at('bag'), shower = at('shower'), out = [];
  if (dog === null || dog >= 17) out.push('dog');
  if (hw === null || hw >= 19) out.push('hw');
  if (games === null || (hw !== null && games < hw)) out.push('games');
  if (bag === null || (hw !== null && bag < hw)) out.push('bag');
  if (shower !== 20) out.push('shower');
  return out;
}
// Несподіванка: гурток переїжджає, справа з нової години повертається в пул
function applySurprise(slots, newHour) {
  const s = Object.assign({}, slots), displaced = s[newHour] || null;
  delete s[newHour];
  return { slots: s, displaced, club: newHour };
}
function sumCoins(coins) { return coins.reduce((a, b) => a + b, 0); }
function isExact(coins, target) { return sumCoins(coins) === target; }
function emoScore(sit, chosen) {
  if (sit.pick === 1) return chosen.length && sit.ok.includes(chosen[0]) ? 1 : 0;
  return chosen.slice(0, 2).filter(c => sit.ok.includes(c)).length * 0.5;
}
function picnic910Points(cart) {
  const n = id => cart[id] || 0; let p = 0;
  if (n('sandwich') >= 3 || n('baton') >= 1) p += 1;
  if (n('juice15') >= 1 || n('juice05') >= 3) p += 1;
  if (n('juice15') >= 1) p += 0.5;
  if (n('baton') >= 1) p += 0.5;
  if (n('promo') === 0) p += 1;
  return p;
}
function safeLevel(s, c) {
  const l1 = s.locks[0];
  if (!l1) return 1;
  if (l1.opened || (s.end === 'time' && l1.attempts.length >= c.minAttempts)) return 3;
  if ((s.end === 'stopped' && s.stoppedAt >= c.stopSec) || l1.hint) return 2;
  if (s.end === 'time') return 2;
  return 1;
}
// Увага: рівень з пройдених раундів (пропущені {skipped:true} не рахуються); немає пройдених → null
function attentionScore(R) {
  const targets = R.cells.filter(x => x.k === 't').length; let hits = 0, fa = 0;
  R.marks.forEach(i => (R.cells[i].k === 't' ? hits++ : fa++));
  return { targets, hits, falseMarks: fa, score: Math.max(0, Math.min(1, (hits - fa) / targets)), timeUsed: R.timeUsed };
}
function attentionLevel(rounds, t) {
  const done = rounds.filter(r => r && !r.skipped && r.cells);
  if (!done.length) return null;
  const avg = done.map(attentionScore).reduce((a, b) => a + b.score, 0) / done.length;
  return avg >= t.l3 ? 3 : avg >= t.l2 ? 2 : 1;
}
// Хранитель кодів: найдовший правильний код + частка правильних «Що зникло?»
function memoryLevel(s, c) {
  const T = c.thresholds;
  let code = null, longest = 0;
  if (!s.codeSkipped && s.attempts.length) {
    longest = Math.max(0, ...s.attempts.filter(a => a.ok).map(a => a.len));
    code = th(longest, T.code.l3, T.code.l2);
  }
  const answered = s.miss.rounds.filter(r => r && !r.skipped && r.answer !== undefined);
  const ok = answered.filter(r => r.ok).length;
  const miss = answered.length ? th(ok / answered.length, T.miss.l3, T.miss.l2) : null;
  return { level: ceilAvgN(code, miss), code, miss, longest, missOk: ok, missAnswered: answered.length };
}
// Креативність: пороги ідей масштабуються на частку пройдених раундів
function creativityLevel(rounds, totalRounds, T) {
  const done = rounds.filter(r => r && !r.skipped);
  if (!done.length) return { level: null, ideas: 0, cats: 0 };
  const all = done.flatMap(r => r.ideas), cats = new Set(all).size, k = done.length / totalRounds;
  const l3i = Math.ceil(T.l3.ideas * k), l2i = Math.ceil(T.l2.ideas * k);
  const level = (all.length >= l3i && cats >= Math.min(T.l3.cats, l3i)) ? 3 : all.length >= l2i ? 2 : 1;
  return { level, ideas: all.length, cats };
}
function newSeq(len, n) { const a = []; for (let i = 0; i < len; i++) { let x; do { x = rnd(n); } while (i && x === a[i - 1]); a.push(x); } return a; }
function shuffleDifferent(a) { if (a.length < 2) return a.slice(); let b; let k = 0; do { b = shuffle(a); k++; } while (k < 20 && b.every((x, i) => x === a[i])); return b; }
function fmtDate(d) { return new Date(d).toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric' }); }

/* =====================================================================
   СТАНЦІЇ
   Кожна: init(c) · round(s) · fresh(s) · skipRound(s,c) · view(s,c) · act{} · level(s,c)
   level → { level: 1|2|3|null, evidence, short, metrics }
   ===================================================================== */
function closeRound(s) { if (s.curR != null && s.rt && s.rt[s.curR] && !s.rt[s.curR].end) s.rt[s.curR].end = Date.now(); }
function finishStation(s) { closeRound(s); s.done = true; s.finishedAt = Date.now(); ui.justEarned = S.idx; ui.celebrate = true; }
function corr(s, kind) { s.corr = s.corr || {}; s.corr[kind] = (s.corr[kind] || 0) + 1; }
function markSkip(s, r) { s.skippedRounds = s.skippedRounds || []; s.skippedRounds.push(r); S.skips.rounds++; ui.playToken++; setTimeout(() => toast('Переходимо далі!'), 40); }
const STN = {};

/* ---------------- 1. Увага ---------------- */
STN.attention = {
  init: () => ({ phase: 'intro', round: 0, rounds: [] }),
  round: s => s.round,
  fresh: s => s.round === 0 && s.phase === 'intro',
  gen(rc) {
    const cells = [];
    rc.find.forEach(f => { for (let i = 0; i < f.c; i++) cells.push({ e: f.e, k: 't' }); });
    rc.traps.forEach(f => { for (let i = 0; i < f.c; i++) cells.push({ e: f.e, k: 'p' }); });
    while (cells.length < rc.n * rc.n) cells.push({ e: rc.fill[rnd(rc.fill.length)], k: 'd' });
    return shuffle(cells);
  },
  advance(s, c) { if (s.round < c.rounds.length - 1) { s.round++; s.phase = 'intro'; } else finishStation(s); },
  endRound(s, c) {
    const R = s.rounds[s.round]; R.endedAt = Date.now(); R.timeUsed = Math.min(c.roundSec, Math.round((R.endedAt - R.startedAt) / 1000));
    STN.attention.advance(s, c);
  },
  skipRound(s, c) { s.rounds[s.round] = { skipped: true }; markSkip(s, s.round); STN.attention.advance(s, c); },
  view(s, c) {
    const rc = c.rounds[s.round], ems = a => a.map(f => f.e).join(' ');
    if (s.phase === 'intro') {
      const head = s.round > 0 ? `<div class="pill">Далі — раунд ${s.round + 1} з ${c.rounds.length}</div>` : `<div class="pill">Раунд 1 з ${c.rounds.length}</div>`;
      return {
        child: `<div class="center">${head}
          <h2 style="font-size:30px">${rc.newRule ? '<span class="pill newrule">Нове правило!</span> ' : ''}${esc(rc.rule)}</h2>
          <div class="rulecard"><div class="card"><div class="lbl">Шукаємо</div><div class="em">${ems(rc.find)}</div></div>
          <div class="card"><div class="lbl">Не плутай — це пастки</div><div class="em">${ems(rc.traps)}</div></div></div>
          <div class="lead muted">У кожної клітинки є номер. Називай номери — і вони позначаться.</div></div>`,
        teacher: tb('attention.start', `▶ Старт раунду ${s.round + 1}`, { primary: true }) + hint(`${c.roundSec} с на раунд.`),
        iskra: c.iskra.intro[s.round] || c.iskra.intro[0]
      };
    }
    const R = s.rounds[s.round];
    const cells = R.cells.map((cell, i) => `<button class="cell${R.marks.includes(i) ? ' marked' : ''}" data-act="attention.mark" data-arg="${i}"><span class="num">${i + 1}</span>${cell.e}</button>`).join('');
    return {
      timer: R.endsAt,
      onTimeUp: () => STN.attention.endRound(s, c),
      child: `<div class="att"><div class="findbar">Шукай: <span class="em">${ems(rc.find)}</span><span class="muted">· пастки: ${ems(rc.traps)}</span></div>
        <div class="grid" style="--n:${rc.n}">${cells}</div></div>`,
      teacher: tb('attention.end', '⏹ Завершити раунд') + hint('Клікай номери, які називає дитина.'),
      iskra: c.iskra.play
    };
  },
  act: {
    start(s, _, c) { const now = Date.now(); s.rounds[s.round] = { cells: STN.attention.gen(c.rounds[s.round]), marks: [], startedAt: now, endsAt: now + c.roundSec * 1000, unmarks: 0 }; s.phase = 'play'; },
    mark(s, a) {
      const R = s.rounds[s.round]; if (!R || s.phase !== 'play') return;
      const i = +a, k = R.marks.indexOf(i);
      if (k >= 0) { R.marks.splice(k, 1); R.unmarks = (R.unmarks || 0) + 1; corr(s, 'unmark'); } else R.marks.push(i);
    },
    end(s, _, c) { if (s.phase === 'play') STN.attention.endRound(s, c); }
  },
  level(s, c) {
    const done = s.rounds.map((r, i) => ({ r, i })).filter(x => x.r && !x.r.skipped && x.r.cells);
    const level = attentionLevel(s.rounds, c.thresholds);
    if (level === null) return { level: null, evidence: CONFIG.report.skippedAll + '.', short: '—', metrics: { rounds: s.rounds } };
    const m = done.map(x => ({ i: x.i, ...attentionScore(x.r) }));
    const avg = m.reduce((a, b) => a + b.score, 0) / m.length;
    const H = m.reduce((a, b) => a + b.hits, 0), T = m.reduce((a, b) => a + b.targets, 0), F = m.reduce((a, b) => a + b.falseMarks, 0);
    let ev = `Знайдено ${H} з ${T} цілей, зайвих позначок — ${F}`;
    const ri = c.rounds.findIndex(r => r.evLabel), mr = m.find(x => x.i === ri);

    ev += `. Середня точність — ${Math.round(avg * 100)}%.`;
    const sk = s.rounds.filter(r => r && r.skipped).length;

    return { level, evidence: ev, short: `${H} з ${T} цілей, ${F} ${pl(F, ['зайва', 'зайві', 'зайвих'])}`, metrics: { rounds: m, avg, skipped: sk } };
  }
};

/* ---------------- 2. Пам’ять ---------------- */

      return { child: `<div class="center"><div class="lead">Який був код?</div>${tiles(true, false)}<div class="slots">${slots}</div></div>`,
        teacher: tb('memory.erase', '⌫ Стерти останню', { disabled: !s.input.length }) + tb('memory.done', '✔ Готово', { primary: true }) + hint('«Готово» можна й з неповним кодом.'),
        iskra: c.iskra.input };

  act: {

    tap(s, a) { if (s.phase !== 'input' || s.input.length >= s.len) return; s.input.push(+a); },
    erase(s) { if (s.input.length) { s.input.pop(); corr(s, 'erase'); } },
    done(s, _, c) {
      if (s.phase !== 'input') return;
      const ok = s.input.length === s.seq.length && s.input.every((v, i) => v === s.seq[i]);
      s.attempts.push({ len: s.len, seq: s.seq.slice(), input: s.input.slice(), ok });
      if (ok) { s.len++; s.errs = 0; } else s.errs++;
      if (s.errs >= 2 || s.len > c.maxLen || s.shows >= c.maxShows) STN.memory.toMiss(s);
      else { s.phase = 'next'; s.seq = []; s.input = []; }
    },
    missStart(s, _, c) {
      if (s.phase !== 'missIntro') return;
      const M = s.miss, N = c.missN[M.round], items = shuffle(c.items).slice(0, N), gi = rnd(N);
      const rest = items.filter((_, i) => i !== gi);
      M.rounds[M.round] = { items, gone: items[gi], rest: c.shuffleMiss ? shuffleDifferent(rest) : rest, answer: undefined, ok: false };
      M.endsAt = Date.now() + c.missShowSec * 1000; s.phase = 'missShow'; ui.missReveal = false;
    },
    reveal() { ui.missReveal = true; },
    missAnswer(s, a, c) {
      const M = s.miss, R = M.rounds[M.round]; if (!R || s.phase !== 'missAnswer') return;
      R.answer = a || null; R.ok = a === R.gone; ui.missReveal = false;
      STN.memory.missAdvance(s, c);
    }
  },
  level(s, c) {
    const r = memoryLevel(s, c);
    if (r.level === null) return { level: null, evidence: CONFIG.report.skippedAll + '.', short: '—', metrics: r };
    const codeTxt = r.code === null ? 'код — пропущено' : `найдовший код — ${r.longest || 'не вдалося повторити стартовий'} (показів: ${s.shows})`;
    const missSk = s.miss.rounds.filter(x => x && x.skipped).length;
    const missTxt = r.miss === null ? '«Що зникло?» — пропущено' : `«Що зникло?» — ${r.missOk} з ${r.missAnswered}${missSk ? ' (один набір пропущено)' : ''}`;
    const ev = codeTxt[0].toUpperCase() + codeTxt.slice(1) + '; ' + missTxt + '.';
    const short = [r.code === null ? null : `код ${r.longest || '—'}`, r.miss === null ? null : `зникло ${r.missOk}/${r.missAnswered}`].filter(Boolean).join(', ');
    return { level: r.level, evidence: ev, short, metrics: { ...r, shows: s.shows, attempts: s.attempts } };
  }
};

/* ---------------- 3. Планування ---------------- */
STN.planning = {
  init(c) {
    if (S.group === '78') return { phase: 'pack', pack: { order: shuffle(c.items.map(i => i.id)), bag: [] }, morning: { pool: shuffle(c.morning.map(m => m.id)), slots: Array(c.morning.length).fill(null) }, res: {} };
    return { phase: 'plan1', sel: null, slots: {}, club: c.club.hour, displaced: null, res: {} };
  },
  round: s => (s.phase === 'pack' || s.phase === 'plan1' ? 0 : 1),
  fresh: s => (S.group === '78' ? s.phase === 'pack' && !s.pack.bag.length : s.phase === 'plan1' && !Object.keys(s.slots).length),
  skipRound(s) {
    const r = STN.planning.round(s); markSkip(s, r);
    if (S.group === '78') { if (r === 0) { s.res.pack = { skipped: true }; s.phase = 'morning'; } else { s.res.morning = { skipped: true }; finishStation(s); } }
    else { if (r === 0) { s.res.r1 = { skipped: true }; s.phase = 'surprise'; } else { s.res.r2 = { skipped: true }; finishStation(s); } }
    s.sel = null; ui.flash = null;
  },
  view(s, c) {
    if (S.group === '78') {
      if (s.phase === 'pack') {
        const it = id => c.items.find(x => x.id === id);
        const thing = (x, act, cls = '') => `<button class="thing${cls}" data-act="${act}" data-arg="${x.id}"><span class="e">${x.e}</span><span class="n">${esc(x.name)}</span></button>`;
        const shelf = s.pack.order.map(id => s.pack.bag.includes(id) ? '<div class="thing empty"></div>' : thing(it(id), 'planning.bag')).join('');
        const bag = s.pack.bag.map(id => thing(it(id), 'planning.unbag', ui.flash === id ? ' fly' : '')).join('');
        return { title: c.titles[0], child: `<div class="pack">
            <div class="card schedule"><div class="lbl">Розклад на завтра</div>${c.schedule.map(x => `<div class="srow"><span>${x.e}</span>${esc(x.name)}</div>`).join('')}
            <div class="lbl" style="margin-top:8px">Погода</div><div class="srow"><span>${c.weather.e}</span>${esc(c.weather.name)}</div></div>
            <div class="shelf">${shelf}</div><div class="bag">${bag}</div></div>`,
          teacher: tb('planning.packDone', '✔ Рюкзак зібрано', { primary: true }) + hint('Клік — у рюкзак, клік у рюкзаку — вийняти.'), iskra: c.iskra.pack };
      }
      const m = id => c.morning.find(x => x.id === id);
      const card = (x, act, arg) => `<button class="mcard" data-act="${act}" data-arg="${arg}"><span class="e">${x.e}</span>${esc(x.name)}</button>`;
      const pool = s.morning.pool.map(id => card(m(id), 'planning.place', id)).join('');
      const slots = s.morning.slots.map((id, i) => `<div class="mslot"><div class="no">${i + 1}</div>${id ? card(m(id), 'planning.unplace', i) : ''}</div>${i < s.morning.slots.length - 1 ? '<span class="arrow">→</span>' : ''}`).join('');
      return { title: c.titles[1], child: `<div class="morning"><div class="lead" style="margin:0 auto;text-align:center">Що герой робить вранці? Постав картки по порядку.</div>
          <div class="cards">${pool}</div><div class="mslots">${slots}</div></div>`,
        teacher: tb('planning.morningDone', '✔ Готово', { primary: true, disabled: s.morning.slots.some(x => !x) }) + hint('Клік по картці — у вільну клітинку; клік у клітинці — повернути.'),
        iskra: c.iskra.morning };
    }
    if (s.phase === 'surprise') {
      return { title: c.titles[1], child: `<div class="center"><div class="surprise">📣</div><div class="huge">${esc(c.surpriseText)}</div>
          <div class="lead">Справа, що стояла на ${c.newClubHour}:00, повернеться в список. Треба переставити план.</div></div>`,
        teacher: tb('planning.applySurprise', 'Переставити гурток →', { primary: true }), iskra: c.iskra.surprise };
    }
    const task = id => c.tasks.find(t => t.id === id);
    const placed = Object.values(s.slots);
    const pool = c.tasks.filter(t => !placed.includes(t.id)).map(t => `<button class="task${s.sel === t.id ? ' sel' : ''}" data-act="planning.sel" data-arg="${t.id}"><span class="e">${t.e}</span>${esc(t.name)}</button>`).join('') || '<div class="muted">Усі справи в розкладі</div>';
    const hours = c.hours.map(h => {
      const fixed = h === s.club ? c.club : h === c.dinner.hour ? c.dinner : null;
      if (fixed) return `<div class="hour fixed"><span class="t">${h}:00</span><span class="e">${fixed.e}</span>${esc(fixed.name)}</div>`;
      const id = s.slots[h];
      if (id) return `<button class="hour filled" data-act="planning.slot" data-arg="${h}"><span class="t">${h}:00</span><span class="e">${task(id).e}</span>${esc(task(id).name)}</button>`;
      return `<button class="hour empty" data-act="planning.slot" data-arg="${h}"><span class="t">${h}:00</span>—</button>`;
    }).join('');
    const p2 = s.phase === 'plan2';
    return { title: p2 ? c.titles[1] : c.titles[0], child: `<div class="eve">
        <div class="pool"><div class="lbl">Справи</div>${pool}</div>
        <div class="timeline">${p2 ? `<div class="banner">📣 Гурток тепер о ${c.newClubHour}:00</div>` : ''}${hours}</div>
        <div class="card rules"><div class="lbl">Правила</div><ul>${Object.values(c.rules).map(r => `<li>${esc(r)}</li>`).join('')}</ul></div></div>`,
      teacher: tb('planning.planDone', '✔ План готовий', { primary: true }) + hint('Клік по справі, потім по годині.'),
      iskra: p2 ? c.iskra.plan2 : c.iskra.plan1 };
  },
  act: {
    bag(s, a) { if (!s.pack.bag.includes(a)) { s.pack.bag.push(a); ui.flash = a; } },
    unbag(s, a) { s.pack.bag = s.pack.bag.filter(x => x !== a); ui.flash = null; corr(s, 'unbag'); },
    packDone(s, _, c) {
      if (s.phase !== 'pack') return;
      const need = s.pack.bag.filter(id => c.items.find(x => x.id === id).need).length;
      s.res.pack = { need, extra: s.pack.bag.length - need, items: s.pack.bag.slice() }; s.phase = 'morning'; ui.flash = null;
    },
    place(s, a) { const i = s.morning.slots.indexOf(null); if (i < 0) return; s.morning.slots[i] = a; s.morning.pool = s.morning.pool.filter(x => x !== a); },
    unplace(s, a) { const i = +a, id = s.morning.slots[i]; if (!id) return; s.morning.slots[i] = null; s.morning.pool.push(id); corr(s, 'unplace'); },
    morningDone(s) {
      if (s.phase !== 'morning' || s.morning.slots.some(x => !x)) return;
      s.res.morning = { order: s.morning.slots.slice(), violations: morningViolations(s.morning.slots) }; finishStation(s);
    },
    sel(s, a) { s.sel = s.sel === a ? null : a; },
    slot(s, a) { const h = +a; if (s.slots[h]) { delete s.slots[h]; s.sel = null; corr(s, 'free'); } else if (s.sel) { s.slots[h] = s.sel; s.sel = null; } },
    planDone(s) {
      if (s.phase !== 'plan1' && s.phase !== 'plan2') return;
      const broken = eveningBroken(s.slots), rec = { slots: Object.assign({}, s.slots), club: s.club, broken, violations: broken.length };
      if (s.phase === 'plan1') { s.res.r1 = rec; s.phase = 'surprise'; } else { s.res.r2 = rec; finishStation(s); }
      s.sel = null;
    },
    applySurprise(s, _, c) { if (s.phase !== 'surprise') return; const r = applySurprise(s.slots, c.newClubHour); s.slots = r.slots; s.displaced = r.displaced; s.club = r.club; s.phase = 'plan2'; }
  },
  level(s, c) {
    const T = CONFIG.stations.planning.thresholds, vl = v => (v <= T.l3 ? 3 : v <= T.l2 ? 2 : 1);
    if (S.group === '78') {
      const p = s.res.pack, m = s.res.morning, P = c.pack;
      const l1 = p && !p.skipped ? ((p.need >= P.l3.need && p.extra <= P.l3.extra) ? 3 : (p.need >= P.l2.need && p.extra <= P.l2.extra) ? 2 : 1) : null;
      const l2 = m && !m.skipped ? vl(m.violations) : null;
      const level = ceilAvgN(l1, l2);
      if (level === null) return { level: null, evidence: CONFIG.report.skippedAll + '.', short: '—', metrics: { pack: p, morning: m } };
      const nNeed = c.items.filter(i => i.need).length;
      const a = l1 === null ? 'рюкзак — пропущено' : `рюкзак: потрібних речей ${p.need} з ${nNeed}, зайвих — ${p.extra}`;
      const b = l2 === null ? 'ранок — пропущено' : `ранок героя: порушень порядку — ${m.violations}`;
      return { level, evidence: a[0].toUpperCase() + a.slice(1) + '; ' + b + '.',
        short: [l1 === null ? null : `рюкзак ${p.need}/${nNeed} (+${p.extra})`, l2 === null ? null : `ранок: ${m.violations} поруш.`].filter(Boolean).join(', '),
        metrics: { pack: p, morning: m, packLevel: l1, morningLevel: l2 } };
    }
    const r1 = s.res.r1, r2 = s.res.r2;
    const l1 = r1 && !r1.skipped ? vl(r1.violations) : null, l2 = r2 && !r2.skipped ? vl(r2.violations) : null;
    const level = ceilAvgN(l1, l2);
    if (level === null) return { level: null, evidence: CONFIG.report.skippedAll + '.', short: '—', metrics: { r1, r2 } };
    const why = r => r.broken.length ? ` (${r.broken.map(b => c.rules[b].split(' — ')[0].toLowerCase()).join(', ')})` : '';
    const a = l1 === null ? 'план вечора — пропущено' : `вечір: порушень правил — ${r1.violations}${why(r1)}`;
    const b = l2 === null ? 'після несподіванки — пропущено' : `після несподіванки — ${r2.violations}${why(r2)}`;
    return { level, evidence: a[0].toUpperCase() + a.slice(1) + '; ' + b + '.',
      short: `порушень: ${l1 === null ? '—' : r1.violations} → ${l2 === null ? '—' : r2.violations}`, metrics: { r1, r2 } };
  }
};

/* ---------------- 4. Емоції ---------------- */
STN.emotions = {
  init: c => ({ phase: 'warm', warm: 0, i: 0, answers: c.situations.map(() => []), detectSkipped: false }),
  round: s => (s.phase === 'warm' ? 0 : 1),
  fresh: s => s.phase === 'warm' && s.warm === 0,
  skipRound(s) { const r = STN.emotions.round(s); markSkip(s, r); if (r === 0) s.phase = 'detect'; else { s.detectSkipped = true; finishStation(s); } },
  view(s, c) {
    if (s.phase === 'warm') {
      const w = c.warm[s.warm];
      return { title: c.titleWarm, child: `<div class="center"><div class="pill">Розминка · ${s.warm + 1} з ${c.warm.length}</div>
          <div style="font-size:120px;line-height:1">${w.e}</div><div class="huge">${esc(w.name)}</div><div class="lead">Покажи цю емоцію обличчям!</div></div>`,
        teacher: tb('emotions.warmNext', '✔ Показа{в|ла}', { primary: true }) + hint('Розминка, не оцінюється.'), iskra: c.iskra.warm };
    }
    const sit = c.situations[s.i], ch = s.answers[s.i];
    const emos = c.emotions.map(e => `<button class="emo${ch.includes(e.id) ? ' sel' : ''}" data-act="emotions.pick" data-arg="${e.id}">${e.e ? `<span class="e">${e.e}</span>` : ''}${esc(e.name)}</button>`).join('');
    const dots = c.situations.map((_, i) => `<i class="${i === s.i ? 'on' : ''}"></i>`).join('');
    return { title: c.title, child: `<div class="situ">
        <div class="card"><div class="dots">${dots}</div><div class="pic">${sit.e}</div><div class="txt">${esc(sit.text)}</div>${sit.pick === 2 ? '<div class="need2">Обери ДВІ емоції</div>' : ''}</div>
        <div class="emogrid">${emos}</div></div>`,
      teacher: tb('emotions.prev', '← Назад', { disabled: s.i === 0 }) + tb('emotions.next', s.i === c.situations.length - 1 ? 'Завершити →' : 'Далі →', { primary: true })
        + hint(c.readAloud ? 'Прочитай ситуацію вголос.' : 'Дитина читає ситуацію сама.'),
      iskra: sit.pick === 2 ? c.iskra.detect2 : c.iskra.detect };
  },
  act: {
    warmNext(s, _, c) { if (s.phase !== 'warm') return; s.warm++; if (s.warm >= c.warm.length) s.phase = 'detect'; },
    pick(s, a, c) {
      const sit = c.situations[s.i], ch = s.answers[s.i];
      if (sit.pick === 1) { if (ch.length) corr(s, 'change'); s.answers[s.i] = ch[0] === a ? [] : [a]; return; }
      const k = ch.indexOf(a); if (k >= 0) { ch.splice(k, 1); corr(s, 'change'); } else { ch.push(a); if (ch.length > 2) { ch.shift(); corr(s, 'change'); } }
    },
    prev(s) { if (s.i > 0) { s.i--; corr(s, 'back'); } },
    next(s, _, c) { if (s.phase !== 'detect') return; if (s.i < c.situations.length - 1) s.i++; else finishStation(s); }
  },
  level(s, c) {
    if (s.detectSkipped) return { level: null, evidence: CONFIG.report.skippedAll + '.', short: '—', metrics: {} };
    const scores = c.situations.map((sit, i) => emoScore(sit, s.answers[i] || [])), sum = scores.reduce((a, b) => a + b, 0);
    const mixed = c.situations.map((sit, i) => ({ sit, sc: scores[i] })).filter(x => x.sit.pick === 2);
    let ev = `Детектор: ${num(sum)} з ${c.situations.length} балів`;
    if (mixed.length) ev += `; змішані почуття повністю розпізнано в ${mixed.filter(x => x.sc >= 1).length} з ${mixed.length} ситуацій`;
    const missed = c.situations.map((sit, i) => ({ sit, sc: scores[i], ch: s.answers[i] || [] })).filter(x => x.sit.pick === 1 && x.sc < 1);
    if (missed.length) ev += `. Побачено інакше: ${missed.map(x => `${x.sit.e} — ${x.ch.length ? x.ch.map(id => c.emotions.find(e => e.id === id).name.toLowerCase()).join(', ') : 'без відповіді'}`).join('; ')}`;
    return { level: th(sum, c.thresholds.l3, c.thresholds.l2), evidence: ev + '.', short: `${num(sum)} з ${c.situations.length}`, metrics: { scores, sum, answers: s.answers } };
  }
};

/* ---------------- 5. Гроші ---------------- */
STN.money = {
  init: () => (S.group === '78'
    ? { phase: 'picnic', cart: [], t: 0, plate: [], paid: [] }
    : { phase: 'picnic', cart: {}, q: 0, typed: '', choice: null, answers: [] }),
  round: s => (s.phase === 'picnic' ? 0 : 1),
  fresh: s => s.phase === 'picnic' && !(Array.isArray(s.cart) ? s.cart.length : Object.keys(s.cart).length),
  skipRound(s) {
    const r = STN.money.round(s); markSkip(s, r); ui.flash = null;
    if (r === 0) { s.picnic = { skipped: true }; s.phase = S.group === '78' ? 'exact' : 'deal'; }
    else { s.round2Skipped = true; finishStation(s); }
  },
  spent(s, c) { return S.group === '78' ? s.cart.reduce((a, id) => a + c.goods.find(g => g.id === id).price, 0) : Object.entries(s.cart).reduce((a, [id, n]) => a + n * c.goods.find(g => g.id === id).price, 0); },
  view(s, c) {
    const left = c.budget - STN.money.spent(s, c);
    if (S.group === '78') {
      if (s.phase === 'picnic') {
        const goods = c.goods.map(g => s.cart.includes(g.id) ? `<div class="good taken"><span class="e">${g.e}</span><span class="n">${esc(g.name)}</span><span class="price">${g.price} 🪙</span></div>`
          : `<button class="good" data-act="money.take" data-arg="${g.id}"><span class="e">${g.e}</span><span class="n">${esc(g.name)}</span><span class="price">${g.price} 🪙</span></button>`).join('');
        const cart = s.cart.map(id => { const g = c.goods.find(x => x.id === id); return `<button class="good${ui.flash === id ? ' fly' : ''}" data-act="money.untake" data-arg="${id}"><span class="e">${g.e}</span><span class="n">${esc(g.name)}</span></button>`; }).join('');
        return { title: c.titles[0], child: `<div class="shop"><div><div class="lbl">Крамниця</div><div class="goods">${goods}</div></div>
            <div class="basket"><div class="wallet">Монетки: <span class="coins">${'<i class="mini"></i>'.repeat(Math.max(0, left))}</span></div>
            <div class="lbl">Кошик для пікніка</div><div class="cart">${cart}</div></div></div>`,
          teacher: tb('money.picnicDone', '✔ Готово', { primary: true }) + hint('Клік — у кошик, клік у кошику — повернути.'), iskra: c.iskra.picnic };
      }
      const T = c.targets[s.t];
      const coins = c.coins.map(v => `<button class="coin c${v}" data-act="money.coin" data-arg="${v}">${v}</button>`).join('');
      const plate = s.plate.map((v, i) => `<button class="coin" data-act="money.uncoin" data-arg="${i}">${v}</button>`).join('');
      return { title: c.titles[1], child: `<div class="center"><div class="pill">Покупка ${s.t + 1} з ${c.targets.length}</div>
          <div class="huge">${T.e} ${esc(T.name)} — ${T.sum} 🪙</div><div class="lead">Заплати рівно ${T.sum} монет. Які монетки покладеш?</div>
          <div class="row" style="align-items:center">${coins}</div><div class="plate">${plate || '<span class="muted">Тарілочка для монет</span>'}</div></div>`,
        teacher: tb('money.pay', '✔ Заплатити', { primary: true, disabled: !s.plate.length }) + hint('Клік по монеті — на тарілку, клік на тарілці — прибрати.'), iskra: c.iskra.exact };
    }
    if (s.phase === 'picnic') {
      const goods = c.goods.map(g => `<button class="good" data-act="money.take" data-arg="${g.id}"><span class="e">${g.e}</span><span class="n">${esc(g.name)}</span><span class="price">${g.price} грн</span></button>`).join('');
      const lines = Object.entries(s.cart).filter(([, n]) => n > 0).map(([id, n]) => { const g = c.goods.find(x => x.id === id);
        return `<button class="cartline${ui.flash === id ? ' fly' : ''}" data-act="money.untake" data-arg="${id}"><span class="e">${g.e}</span>${esc(g.name)}<span class="x">× ${n}</span></button>`; }).join('');
      return { title: c.titles[0], child: `<div class="shop"><div><div class="lbl">Крамниця</div><div class="goods g4">${goods}</div></div>
          <div class="basket"><div class="card" style="padding:10px 14px"><div class="lead" style="font-size:17px">Пікнік на трьох: їжа на всіх і 1,5 л напою.</div>
          <div class="wallet">Залишок: <span class="pill">${left} грн</span> з ${c.budget}</div></div>
          <div class="lbl">Кошик</div><div class="cart" style="flex-direction:column;flex-wrap:nowrap;overflow:auto">${lines}</div></div></div>`,
        teacher: tb('money.picnicDone', '✔ Готово', { primary: true }) + hint('Клік — +1 шт., клік у кошику — −1.'), iskra: c.iskra.picnic };
    }
    const D = c.deals[s.q];
    let body;
    if (D.type === 'choice') body = `<div class="opts">${D.opts.map(o => `<button class="big${s.choice === o.id ? ' sel' : ''}" data-act="money.choose" data-arg="${o.id}">${esc(o.label)}</button>`).join('')}</div>`;
    else body = `<div class="display">${esc(s.typed) || '&nbsp;'}</div><div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button class="key" data-act="money.key" data-arg="${d}">${d}</button>`).join('')}<button class="key" data-act="money.key" data-arg="del">⌫</button><button class="key" data-act="money.key" data-arg="0">0</button><span></span></div>`;
    return { title: c.titles[1], child: `<div class="center"><div class="pill">Завдання ${s.q + 1} з ${c.deals.length}</div><div class="huge" style="font-size:32px;max-width:820px">${esc(D.text)}</div>${body}</div>`,
      teacher: tb('money.dealNext', s.q === c.deals.length - 1 ? 'Завершити →' : 'Далі →', { primary: true }), iskra: c.iskra.deal };
  },
  act: {
    take(s, a, c) {
      if (s.phase !== 'picnic') return false;
      const g = c.goods.find(x => x.id === a), left = c.budget - STN.money.spent(s, c);
      if (S.group === '78' && s.cart.includes(a)) return false;
      if (g.price > left) { toast(c.notEnough); return false; }
      if (S.group === '78') s.cart.push(a); else s.cart[a] = (s.cart[a] || 0) + 1;
      ui.flash = a;
    },
    untake(s, a) { ui.flash = null; corr(s, 'untake'); if (S.group === '78') s.cart = s.cart.filter(x => x !== a); else if (s.cart[a]) { s.cart[a]--; if (!s.cart[a]) delete s.cart[a]; } },
    picnicDone(s, _, c) {
      if (s.phase !== 'picnic') return;
      ui.flash = null;
      if (S.group === '78') { const has = f => s.cart.some(id => c.goods.find(g => g.id === id)[f]); s.picnic = { food: has('food'), drink: has('drink'), items: s.cart.slice(), spent: STN.money.spent(s, c) }; s.phase = 'exact'; }
      else { s.picnic = { cart: Object.assign({}, s.cart), points: picnic910Points(s.cart), spent: STN.money.spent(s, c) }; s.phase = 'deal'; }
    },
    coin(s, a) { if (s.plate.length < 14) s.plate.push(+a); },
    uncoin(s, a) { s.plate.splice(+a, 1); corr(s, 'uncoin'); },
    pay(s, _, c) {
      if (s.phase !== 'exact' || !s.plate.length) return;
      const T = c.targets[s.t]; s.paid.push({ target: T.sum, coins: s.plate.slice(), sum: sumCoins(s.plate), exact: isExact(s.plate, T.sum) });
      s.plate = []; s.t++;
      if (s.t >= c.targets.length) finishStation(s); else setTimeout(() => toast('Записала! Наступна покупка'), 30);
    },
    choose(s, a) { if (s.choice && s.choice !== a) corr(s, 'change'); s.choice = a; },
    key(s, a) { if (a === 'del') { if (s.typed) corr(s, 'erase'); s.typed = s.typed.slice(0, -1); } else if (s.typed.length < 3) s.typed += a; },
    dealNext(s, _, c) {
      if (s.phase !== 'deal') return;
      const D = c.deals[s.q], ans = D.type === 'choice' ? s.choice : (s.typed === '' ? null : +s.typed);
      s.answers.push({ q: s.q, answer: ans, ok: ans === D.ok }); s.choice = null; s.typed = ''; s.q++;
      if (s.q >= c.deals.length) finishStation(s);
    }
  },
  level(s, c) {
    const pk = s.picnic && !s.picnic.skipped ? s.picnic : null;
    if (S.group === '78') {
      const l1 = pk ? (pk.food && pk.drink ? 3 : (pk.food || pk.drink) ? 2 : 1) : null;
      const ex = s.paid.filter(x => x.exact).length, l2 = s.round2Skipped ? null : th(ex, c.thresholds.exact.l3, c.thresholds.exact.l2);
      const level = ceilAvgN(l1, l2);
      if (level === null) return { level: null, evidence: CONFIG.report.skippedAll + '.', short: '—', metrics: {} };
      const det = s.paid.map(x => x.exact ? `${x.target} ✔` : `${x.target} → ${x.sum}`).join(', ');
      const a = pk ? `Пікнік: їжа — ${pk.food ? 'так' : 'ні'}, вода — ${pk.drink ? 'так' : 'ні'} (витрачено ${pk.spent} з ${c.budget} монет)` : 'Пікнік — пропущено';
      const b = l2 === null ? 'точна сума — пропущено' : `точна сума — ${ex} з ${c.targets.length}${det ? ` (${det})` : ''}`;
      return { level, evidence: `${a}; ${b}.`,
        short: [pk ? `пікнік: ${pk.food ? 'їжа' : '—'}${pk.drink ? ' + вода' : ''}` : null, l2 === null ? null : `точна сума ${ex}/3`].filter(Boolean).join(', '),
        metrics: { picnic: s.picnic, paid: s.paid, picnicLevel: l1, exactLevel: l2 } };
    }
    const l1 = pk ? th(pk.points, c.thresholds.picnic.l3, c.thresholds.picnic.l2) : null;
    const ok = s.answers.filter(x => x.ok).length, l2 = s.round2Skipped ? null : th(ok, c.thresholds.deal.l3, c.thresholds.deal.l2);
    const level = ceilAvgN(l1, l2);
    if (level === null) return { level: null, evidence: CONFIG.report.skippedAll + '.', short: '—', metrics: {} };
    const change = s.answers.find(x => c.deals[x.q].type === 'number');
    const a = pk ? `Пікнік: ${num(pk.points)} з 4 балів (витрачено ${pk.spent} з ${c.budget} грн${(pk.cart.promo || 0) ? ', взято акцію з шоколадками' : ''})` : 'Пікнік — пропущено';
    const b = l2 === null ? '«Що вигідніше?» — пропущено' : `«Що вигідніше?» — ${ok} з ${c.deals.length}${change ? `, решта: ${change.answer ?? '—'}` : ''}`;
    return { level, evidence: `${a}; ${b}.`,
      short: [pk ? `пікнік ${num(pk.points)}/4` : null, l2 === null ? null : `вигода ${ok}/3`].filter(Boolean).join(', '),
      metrics: { picnic: s.picnic, answers: s.answers, picnicLevel: l1, dealLevel: l2 } };
  }
};

/* ---------------- 6. Креативність ---------------- */
STN.creativity = {
  init: () => ({ phase: 'intro', round: 0, rounds: [] }),
  round: s => s.round,
  fresh: s => s.round === 0 && s.phase === 'intro',
  advance(s, c) { if (s.round < c.rounds.length - 1) { s.round++; s.phase = 'intro'; } else finishStation(s); },
  endRound(s, c) { const R = s.rounds[s.round]; R.endedAt = Date.now(); STN.creativity.advance(s, c); },
  skipRound(s, c) { s.rounds[s.round] = { skipped: true, prompt: c.rounds[s.round] }; markSkip(s, s.round); STN.creativity.advance(s, c); },
  sparks(n, flyLast) {
    let h = '';
    for (let i = 0; i < n; i++) {
      const a = i * 2.39996, r = 36 + (i % 5) * 7 + Math.floor(i / 10) * 4;
      const x = 50 + Math.cos(a) * r * 1.15, y = 50 + Math.sin(a) * r;
      h += `<span class="spark${flyLast && i === n - 1 ? ' fly' : ''}" style="left:${Math.max(2, Math.min(95, x))}%;top:${Math.max(2, Math.min(92, y))}%;--fx:${(50 - x) * 4}px;--fy:${(50 - y) * 4}px">✨</span>`;
    }
    return h;
  },
  view(s, c) {
    const P = c.prompts[c.rounds[s.round]];
    const vis = P.svg ? P.svg : `<div class="obj">${P.obj}</div>`;
    if (s.phase === 'intro') {
      return { title: P.title, child: `<div class="center">${s.round ? '<div class="pill">Дякую! Наступне завдання</div>' : ''}<div class="pill">Завдання ${s.round + 1} з ${c.rounds.length}</div>
          <div class="huge">${esc(P.title)}</div><div class="lead">${esc(P.text)}</div><div class="lead muted">Кажи всі ідеї, які спадуть на думку. Чим більше — тим краще!</div></div>`,
        teacher: tb('creativity.start', '▶ Старт', { primary: true }) + hint(`${c.roundSec} с на завдання.`), iskra: c.iskra.intro };
    }
    const R = s.rounds[s.round], fly = ui.flash === 'spark';
    return { title: P.title, timer: R.endsAt, onTimeUp: () => STN.creativity.endRound(s, c),
      child: `<div class="creat">${STN.creativity.sparks(R.ideas.length, fly)}<div class="prompt">${vis}<div class="lead">${esc(P.text)}</div></div></div>`,
      teacher: c.categories.map(k => tb('creativity.idea', `${k.e} ${esc(k.name)}`, { arg: k.id })).join('') + tb('creativity.undo', '↶ Скасувати останню', { disabled: !R.ideas.length }) + tb('creativity.end', '⏹ Завершити раунд'),
      iskra: c.iskra.play };
  },
  act: {
    start(s, _, c) { if (s.phase !== 'intro') return; const now = Date.now(); s.rounds[s.round] = { prompt: c.rounds[s.round], ideas: [], startedAt: now, endsAt: now + c.roundSec * 1000 }; s.phase = 'play'; },
    idea(s, a) { if (s.phase !== 'play') return; s.rounds[s.round].ideas.push(a); ui.flash = 'spark'; AUD.tone(1046, 0.12, 'triangle', 0.05); },
    undo(s) { if (s.phase === 'play') s.rounds[s.round].ideas.pop(); ui.flash = null; },
    end(s, _, c) { if (s.phase === 'play') STN.creativity.endRound(s, c); }
  },
  level(s, c) {
    const r = creativityLevel(s.rounds, c.rounds.length, c.thresholds);
    if (r.level === null) return { level: null, evidence: CONFIG.report.skippedAll + '.', short: '—', metrics: r };
    const done = s.rounds.filter(x => x && !x.skipped), all = done.flatMap(x => x.ideas), cats = [...new Set(all)];
    const per = s.rounds.map(x => `${c.prompts[x.prompt].title.toLowerCase()} — ${x.skipped ? 'пропущено' : x.ideas.length}`).join(', ');
    return { level: r.level, evidence: `Ідей — ${all.length} (${per}), різних категорій — ${cats.length}${cats.length ? `: ${cats.map(id => c.categories.find(k => k.id === id).name).join(', ')}` : ''}.`,
      short: `${all.length} ${pl(all.length, ['ідея', 'ідеї', 'ідей'])}, ${cats.length} ${pl(cats.length, ['категорія', 'категорії', 'категорій'])}`,
      metrics: { ideas: all.length, categories: cats, perRound: s.rounds.map(x => ({ prompt: x.prompt, skipped: !!x.skipped, ideas: x.ideas || [] })) } };
  }
};

/* ---------------- 7. Наполегливість — Сейф ---------------- */
STN.safe = {
  init: () => ({ phase: 'intro', lock: 0, locks: [], guess: [], startedAt: null, endsAt: null, end: null, stoppedAt: null }),
  round: () => 0,
  fresh: s => s.phase === 'intro',
  skipRound(s) { markSkip(s, 0); s.end = 'skipped'; finishStation(s); },
  makeLock(L) { return { code: shuffle(L.fruits).slice(0, L.slots), attempts: [], hint: null, opened: false, openedAt: null, startedAt: Date.now() }; },
  elapsed(s) { return Math.round((Date.now() - s.startedAt) / 1000); },
  finish(s, end) { s.end = end; if (end === 'stopped') s.stoppedAt = STN.safe.elapsed(s); s.endedAt = Date.now(); finishStation(s); },
  view(s, c) {
    if (s.phase === 'intro') {
      return { title: c.title, child: `<div class="center"><div style="font-size:90px;line-height:1">🔐</div><div class="lead">Відгадай код із фруктів. Після кожної спроби сейф підкаже кольорами:</div>
          <div class="legend" style="font-size:19px"><span><i class="fb-g"></i> зелений — фрукт на своєму місці</span><span><i class="fb-y"></i> жовтий — він є в коді, але в іншому місці</span><span><i class="fb-x"></i> сірий — його в коді немає</span></div>
          <div class="lead muted">Фрукти в коді не повторюються.</div></div>`,
        teacher: tb('safe.start', `▶ Старт (${fmtTime(c.totalSec)})`, { primary: true }), iskra: c.iskra.intro };
    }
    const L = c.locks[s.lock], lk = s.locks[s.lock];
    if (s.phase === 'opened') {
      return { title: c.title, timer: s.endsAt, onTimeUp: () => STN.safe.finish(s, 'time'),
        child: `<div class="center"><div style="font-size:100px;line-height:1">🔓</div><div class="huge">Замок ${s.lock + 1} відкрито!</div><div class="lead">Але за ним — ще один замок. Спробуємо?</div></div>`,
        teacher: tb('safe.nextLock', `Замок ${s.lock + 2} →`, { primary: true }) + tb('safe.stop', 'Дитина зупинилась'), iskra: c.iskra.opened };
    }
    const guess = Array.from({ length: L.slots }, (_, i) => {
      if (lk.hint && lk.hint.pos === i) return `<div class="ft hint">${lk.hint.fruit}</div>`;
      return s.guess[i] ? `<div class="ft">${s.guess[i]}</div>` : '<div class="ft empty"></div>';
    }).join('');
    const fruits = L.fruits.map(f => `<button class="fruit" data-act="safe.fruit" data-arg="${f}">${f}</button>`).join('');
    let hist = '';
    s.locks.forEach((lock, li) => {
      if (s.locks.length > 1) hist += `<div class="hsep">Замок ${li + 1}${lock.opened ? ' — відкрито' : ''}</div>`;
      lock.attempts.forEach((a, k) => { hist += `<div class="hrow"><span class="no">${k + 1}</span>${a.guess.map((f, i) => `<div class="ft ${({ green: 'fb-g', yellow: 'fb-y', grey: 'fb-x' })[a.fb[i]]}">${f}</div>`).join('')}</div>`; });
    });
    if (!hist) hist = '<div class="muted" style="margin:auto;text-align:center">Тут з’являтимуться спроби</div>';
    const full = Array.from({ length: L.slots }, (_, i) => (lk.hint && lk.hint.pos === i) || s.guess[i]).every(Boolean);
    const filledOwn = s.guess.some((g, i) => g && !(lk.hint && lk.hint.pos === i));
    return { title: c.title, timer: s.endsAt, onTimeUp: () => STN.safe.finish(s, 'time'),
      child: `<div class="safe"><div class="safeL"><div class="lockhead">🔒 Замок ${s.lock + 1} · ${L.slots} ${pl(L.slots, ['місце', 'місця', 'місць'])}</div>
        <div class="guess">${guess}</div><div class="fruits">${fruits}</div>
        <div class="legend"><span><i class="fb-g"></i> на своєму місці</span><span><i class="fb-y"></i> є в коді, але в іншому місці</span><span><i class="fb-x"></i> немає в коді</span></div></div>
        <div class="history" id="hist">${hist}</div></div>`,
      teacher: tb('safe.check', '✔ Перевірити', { primary: true, disabled: !full }) + tb('safe.erase', '⌫ Стерти', { disabled: !filledOwn })
        + tb('safe.hint', '🗝️ Підказка', { disabled: !!lk.hint || !STN.safe.hintCandidates(s, c).length, title: 'Лише якщо дитина сама попросила' }) + tb('safe.stop', 'Дитина зупинилась'),
      iskra: c.iskra.play,
      after: () => { const h = $('#hist'); if (h) h.scrollTop = h.scrollHeight; } };
  },
  hintCandidates(s, c) {
    const lk = s.locks[s.lock], L = c.locks[s.lock]; if (!lk) return [];
    return Array.from({ length: L.slots }, (_, i) => i).filter(i => !lk.attempts.some(a => a.fb[i] === 'green'));
  },
  act: {
    start(s, _, c) { if (s.phase !== 'intro') return; const now = Date.now(); s.startedAt = now; s.endsAt = now + c.totalSec * 1000; s.locks = [STN.safe.makeLock(c.locks[0])]; s.guess = []; s.phase = 'play'; },
    fruit(s, a, c) {
      if (s.phase !== 'play') return;
      const L = c.locks[s.lock], lk = s.locks[s.lock];
      for (let i = 0; i < L.slots; i++) { if (lk.hint && lk.hint.pos === i) continue; if (!s.guess[i]) { s.guess[i] = a; return; } }
    },
    erase(s, _, c) {
      const L = c.locks[s.lock], lk = s.locks[s.lock];
      for (let i = L.slots - 1; i >= 0; i--) { if (lk.hint && lk.hint.pos === i) continue; if (s.guess[i]) { s.guess[i] = null; corr(s, 'erase'); return; } }
    },
    check(s, _, c) {
      if (s.phase !== 'play') return;
      const L = c.locks[s.lock], lk = s.locks[s.lock];
      const g = Array.from({ length: L.slots }, (_, i) => (lk.hint && lk.hint.pos === i) ? lk.hint.fruit : s.guess[i]);
      if (g.some(x => !x)) return;
      const fb = wordle(g, lk.code); lk.attempts.push({ guess: g, fb, at: STN.safe.elapsed(s) }); s.guess = [];
      if (fb.every(x => x === 'green')) {
        lk.opened = true; lk.openedAt = STN.safe.elapsed(s); AUD.sticker(); confetti(30);
        if (s.lock < c.locks.length - 1) s.phase = 'opened'; else STN.safe.finish(s, 'opened');
      }
    },
    hint(s, _, c) {
      const lk = s.locks[s.lock]; if (lk.hint) return;
      const cand = STN.safe.hintCandidates(s, c); if (!cand.length) return;
      const pos = cand[rnd(cand.length)]; lk.hint = { pos, fruit: lk.code[pos], at: STN.safe.elapsed(s) }; s.guess[pos] = null;
    },
    nextLock(s, _, c) { if (s.phase !== 'opened') return; s.lock++; s.locks.push(STN.safe.makeLock(c.locks[s.lock])); s.guess = []; s.phase = 'play'; },
    stop(s) { if (s.phase === 'play' || s.phase === 'opened') STN.safe.finish(s, 'stopped'); }
  },
  level(s, c) {
    if (s.end === 'skipped' || !s.locks.length) return { level: null, evidence: CONFIG.report.skippedAll + '.', short: '—', metrics: { end: s.end } };
    const level = safeLevel(s, c), [l1, l2] = s.locks;
    const n = k => `${k} ${pl(k, ['спробу', 'спроби', 'спроб'])}`, nn = k => `${k} ${pl(k, ['спроба', 'спроби', 'спроб'])}`;
    const tail = s.end === 'time' ? ' до кінця часу' : s.end === 'stopped' ? `, зупинка на ${fmtTime(s.stoppedAt)}` : '';
    let ev = l1.opened ? `Замок 1 відкрито за ${n(l1.attempts.length)} (${fmtTime(l1.openedAt)})` : `Замок 1: ${nn(l1.attempts.length)}${tail}`;
    ev += l1.hint ? ', з підказкою (дитина попросила сама)' : ', без підказки';
    if (l2) ev += `; замок 2 — ${nn(l2.attempts.length)}${l2.opened ? `, відкрито (${fmtTime(l2.openedAt)})` : tail}${l2.hint ? ', з підказкою' : ''}`;
    ev += '.';
    const short = l1.opened ? `замок 1 за ${n(l1.attempts.length)}` : `${nn(l1.attempts.length)}${s.end === 'time' ? ', до кінця часу' : s.end === 'stopped' ? `, зупинка ${fmtTime(s.stoppedAt)}` : ''}`;
    return { level, evidence: ev, short, metrics: { end: s.end, stoppedAt: s.stoppedAt, locks: s.locks.map(l => ({ slots: l.code.length, attempts: l.attempts.length, opened: l.opened, openedAt: l.openedAt, hint: !!l.hint })) } };
  }
};

    else if (s.skippedStation) out[k] = { level: null, evidence: CONFIG.report.skippedStation + '.', short: '—', metrics: null, skipped: true };

}

function importCompare(file) {

    try {
      const J = JSON.parse(fr.result);

  },

  const sc = { minAttempts: 3, stopSec: 90 };
  eq('Сейф: рівні', [
    safeLevel({ end: 'opened', locks: [{ opened: true, attempts: [1], hint: null }] }, sc),
    safeLevel({ end: 'time', locks: [{ opened: false, attempts: [1, 2, 3], hint: null }] }, sc),
    safeLevel({ end: 'stopped', stoppedAt: 120, locks: [{ opened: false, attempts: [1], hint: null }] }, sc),
    safeLevel({ end: 'stopped', stoppedAt: 40, locks: [{ opened: false, attempts: [1], hint: { pos: 0 } }] }, sc),
    safeLevel({ end: 'stopped', stoppedAt: 40, locks: [{ opened: false, attempts: [1], hint: null }] }, sc)], [3, 3, 2, 2, 1]);
  const seq = newSeq(9, 6);
  eq('Код: без однакових підряд', seq.every((x, i) => !i || x !== seq[i - 1]), true);
  eq('Підказки вчителя: є для всіх станцій', ORDER.every(k => Array.isArray(CONFIG.teacherHints[k])), true);

  const pass = R.filter(r => r.ok).length, fail = R.length - pass;
  console.log(`%c[САМОТЕСТИ] ${pass}/${R.length} пройдено${fail ? `, ${fail} провалено` : ''}`, `font-weight:bold;color:${fail ? '#c00' : '#1F9D63'}`);
  R.forEach(r => (r.ok ? console.log('  ✔ ' + r.name) : console.error(`  ✘ ${r.name}: отримано ${r.got}, очікувалось ${r.exp}`)));
  window.__selftest = { pass, fail, total: R.length, results: R };
  return window.__selftest;
}

/* ---------- старт ---------- */
S = load() || freshState();
if ((!S.group || !S.gender) && S.screen !== 'setup') S.screen = 'setup';
setInterval(() => { tick(); updateInfo(); }, 200);
render();
if (new URLSearchParams(location.search).get('test') === '1') selfTest();
</script>
