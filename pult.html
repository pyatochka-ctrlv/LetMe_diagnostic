<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульт МІКа — не демонструвати</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E2A5A;--muted:#5B6690;--line:#DCE0EA;--soft:#F4F6FB;--accent:#6C4DFF;--red:#C8323C;--yellow:#FFC93C;
  --head:'Unbounded','Arial Black',system-ui,sans-serif;--text:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#EEF1F7;color:var(--navy);font:15px/1.45 var(--text)}
button{font-family:inherit;color:inherit}
.hdr{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);height:56px}
.hdr h1{font:700 16px var(--head);margin:0}
.hdr .warn{font-size:12px;font-weight:700;color:var(--red);border:1.5px solid var(--red);border-radius:6px;padding:1px 6px}
.conn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.conn i{width:10px;height:10px;border-radius:50%;background:#C8323C}
.conn.on i{background:#1F9D63}
details.memo{font-size:13px;margin-left:auto}
details.memo summary{cursor:pointer;font-weight:700}
details.memo div{position:absolute;right:70px;top:48px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-width:440px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:260px;z-index:20}
.b{font:600 14px/1.1 var(--text);padding:9px 14px;border:1.5px solid var(--navy);border-radius:10px;background:#fff;cursor:pointer;text-align:left}
.b:hover{background:var(--soft)}
.b.primary{background:var(--navy);color:#fff}
.b.big{font-size:17px;padding:14px 22px}
.b.sel{background:#EEEBFF;border-color:var(--accent);outline:2px solid var(--accent)}
.b:disabled{opacity:.4;cursor:not-allowed}
.b.arm{background:#FFE7A8}
.b.ghost{border-color:#B8BFD4;color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding:16px 18px 40px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.setup{max-width:720px;margin:20px auto;display:flex;flex-direction:column;gap:12px}
.frow{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:12px}
.frow label,.frow .l{font-weight:700}
.req{color:var(--red)}
.inp{font:600 16px var(--text);padding:8px 12px;border:1.5px solid var(--navy);border-radius:10px;width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
details.how{background:#F6F4FF;border:1px solid #D9D2FF;border-radius:12px;padding:10px 14px}
details.how summary{cursor:pointer;font-weight:800}
.lesson{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.stages{display:flex;flex-direction:column;gap:4px;font-size:14px}
.stg{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:8px}
.stg.cur{background:#EEEBFF;font-weight:700}
.stg .st{font-size:12px;color:var(--muted)}
.stg>.st{white-space:nowrap}
.stg.done .st{color:#1F7A4C}.stg.skip .st{color:#9A6B00}
.total{margin-top:8px;font-weight:800;font-size:15px}
.say{border-left:6px solid var(--accent);background:#F6F4FF;border-radius:0 12px 12px 0;padding:12px 16px}
.say .lbl,.lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.say p{font-size:21px;line-height:1.4;font-weight:600;margin:6px 0 0}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:10px;font-size:14px}
.guide>div{background:var(--soft);border-radius:10px;padding:8px 10px}
.guide .check{grid-column:1/-1;background:#EEF7F1}
.dont{color:var(--red)}
.input{margin-top:12px}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.codes{display:flex;flex-direction:column;gap:6px}
.ex{font-size:13px;color:var(--muted);margin:2px 0 6px 6px}
.info{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.actions{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:14px;padding:12px 0;background:linear-gradient(transparent,#EEF1F7 30%)}
.timer{font:800 22px var(--head);background:var(--yellow);border:2px solid var(--navy);border-radius:999px;padding:2px 14px}
.ft{display:inline-grid;place-items:center;width:40px;height:40px;border:2px solid var(--navy);border-radius:10px;font-size:22px;background:#fff}
.ft.empty{border-style:dashed}
.fb-g{background:#1F9D63}.fb-y{background:#FFC93C}.fb-x{background:#B9C0CF}
.hrow{display:flex;gap:6px;align-items:center;margin:3px 0}
.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.keypad{display:grid;grid-template-columns:repeat(3,70px);gap:8px;margin-top:8px}
.hint{font-size:13px;color:var(--muted)}
.cheat{margin-top:12px;background:#FFF8E1;border:1px solid #F1D27A;border-radius:12px;padding:10px 14px;font-size:14px}.cheat p{margin:4px 0 8px}.cheat ul{margin:4px 0 8px;padding-left:18px}
img.emoji{height:1.1em;width:1.1em;margin:0 .05em;vertical-align:-0.18em}
.noti{background:#FFF6DA;border:1px solid #F1D27A;border-radius:10px;padding:10px 12px;font-size:14px}
/* ---------- звіт: веб-сторінка зі скролом ---------- */
.rp-top{position:sticky;top:56px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:0 0 12px 12px;max-width:900px;margin:0 auto 12px;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(30,42,90,.06)}
.rp-top .nm{font:700 15px var(--head)}
.rp-top .ttl{font-size:13px;color:var(--muted)}
.marks{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.mark{font:600 12px var(--text);border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:#fff;cursor:pointer;white-space:nowrap}
.mark:hover{background:var(--soft)}
.rp{background:#fff;max-width:900px;margin:0 auto;padding:30px 28px 46px;font-size:16px;line-height:1.6;border:1px solid var(--line);border-radius:6px}
.rp h1{font:700 28px var(--head);margin:4px 0 14px}
.rp h2{font:800 19px var(--text);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid #D5DAE6}
.rp h3{font:700 17px var(--text);margin:0}
.rp-brand{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B7393}
.rp-meta{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0;padding:12px 0;border-top:2px solid var(--navy);border-bottom:1px solid #D5DAE6}
.rp-meta div{display:flex;flex-direction:column}.rp-meta dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#6B7393;font-weight:700}.rp-meta dd{margin:0;font-weight:600}
.rp section{margin-top:26px;scroll-margin-top:120px}
.rp p{margin:0 0 8px}.rp ul{margin:4px 0 8px;padding-left:20px}
.rp-profile{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.rp-profile table{table-layout:fixed;font-size:12.5px}.rp-profile th{font-size:9.5px;letter-spacing:.02em}
.rp-profile th:nth-child(1){width:20%}.rp-profile th:nth-child(2){width:24%}.rp-profile th:nth-child(3){width:26%}.rp-profile th:nth-child(4){width:15%}.rp-profile th:nth-child(5){width:15%}
.rp td{overflow-wrap:break-word}
.rp table{width:100%;border-collapse:collapse;font-size:13.5px}
.rp th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6B7393;border-bottom:1px solid var(--navy);padding:5px}
.rp td{border-bottom:1px solid #E3E7F0;padding:6px 5px;vertical-align:top}
.rp td.nm{font-weight:700}
.lv{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.lv1{background:#FDE2E2;color:#9B1C1C}.lv2{background:#FFF1C2;color:#7A5300}.lv3{background:#D6F2E1;color:#11643B}.lv0{background:#F1F2F6;color:#6B7393}
.dots3{color:#6C4DFF;white-space:nowrap}
.rp-skill{border-top:1px solid #E3E7F0;padding:12px 0;break-inside:avoid;scroll-margin-top:120px}
.rp-skill .hd{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.rp-skill dl{display:grid;grid-template-columns:170px minmax(0,1fr);gap:4px 14px;margin:4px 0 0;font-size:15px}
.rp-skill dt{color:#6B7393;font-weight:600}.rp-skill dd{margin:0}.rp-skill dd ul{margin:0;padding-left:18px}
.rp-note{font-size:12.5px;color:#6B7393}
.rp-legend{display:flex;gap:14px;font-size:12px;color:#4A5378;margin-top:6px;flex-wrap:wrap}
.radar{width:100%;height:auto}
.rp-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px auto 0;max-width:900px}
/* компактний режим для html2pdf (html2canvas не застосовує @media print) */
.rp.pdf{border:0;padding:0 2px;font-size:12px;line-height:1.36;width:auto;max-width:none}
.rp.pdf h1{font-size:22px;margin:2px 0 8px}.rp.pdf h2{font-size:15px;margin-bottom:5px;padding-bottom:3px}.rp.pdf h3{font-size:13px}
.rp.pdf section{margin-top:12px}
.rp.pdf .rp-profile{grid-template-columns:190px minmax(0,1fr);gap:10px}
.rp.pdf .radar{width:190px;height:168px}
.rp.pdf .rp-profile table{font-size:10.5px}.rp.pdf td{padding:2px 4px;line-height:1.3}.rp.pdf th{padding:3px 4px;font-size:9.5px}
.rp.pdf .lv{font-size:10px;padding:0 4px}
.rp.pdf .rp-skills{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
.rp.pdf .rp-skill{padding:6px 0}
.rp.pdf .rp-skill dl{display:block;font-size:11.5px;margin-top:2px}
.rp.pdf .rp-skill dt{display:inline;font-weight:700;color:var(--navy)}.rp.pdf .rp-skill dt::after{content:': '}
.rp.pdf .rp-skill dd{display:inline}.rp.pdf .rp-skill dd::after{content:'';display:block;margin-bottom:1px}
.rp.pdf .rp-skill dd ul{display:block;margin:0;padding-left:14px}
.rp.pdf p,.rp.pdf ul{margin-bottom:4px}
@media print{
  @page{size:A4;margin:12mm 13mm}
  body{background:#fff}
  .hdr,.no-print,.actions,.lesson,.setup,.rp-top{display:none !important}
  .wrap{padding:0;max-width:none}
  .rp{border:0;padding:0;max-width:none;font-size:9.6pt;line-height:1.38}
  .rp h1{font-size:17pt;margin:2px 0 8px}.rp h2{font-size:11.5pt;margin-bottom:5px;padding-bottom:3px;break-after:avoid}.rp h3{font-size:10pt}
  .rp section{margin-top:12px}
  .rp-profile{grid-template-columns:135px minmax(0,1fr);gap:10px}
  .rp-profile table{font-size:7.4pt;table-layout:fixed}
  .rp-profile th:nth-child(1){width:15%}.rp-profile th:nth-child(2){width:33%}.rp-profile th:nth-child(3){width:30%}.rp-profile th:nth-child(4){width:12%}.rp-profile th:nth-child(5){width:10%}
  .lv{font-size:6.8pt;padding:0 4px}
  .rp td{padding:2px 4px;line-height:1.3}.rp th{padding:3px 4px;font-size:7.4pt}
  .rp-skills{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
  .rp-skill{padding:6px 0}
  .rp-skill dl{display:block;font-size:8.5pt;margin-top:2px}
  .rp-skill dt{display:inline;font-weight:700;color:var(--navy)}.rp-skill dt::after{content:': '}
  .rp-skill dd{display:inline}.rp-skill dd::after{content:'';display:block;margin-bottom:1px}
  .rp-skill dd ul{display:block;margin:0;padding-left:14px}
  .rp p,.rp ul{margin-bottom:4px}
  .rp tr,.rp li,.rp-skill,.rp p{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="hdr">
  <h1>Пульт МІКа</h1><span class="warn">не демонструвати</span>
  <span class="conn" id="conn"><i></i><span>Вікно гри не знайдено</span></span>
  <details class="memo"><summary>Пам’ятка</summary><div id="memo"></div></details>
  <div class="menu" id="menu"></div>
</header>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="hero-pixel.js"></script>
<script src="core.js"></script>
<script>
let S = SYNC.load() || freshState();
const ui = { lastPing: 0, arm: null, armT: null, menu: false, ex: {}, view: null, lastT: 0, blocked: false, undo: [] };
const $ = q => document.querySelector(q);
const T = s => tplG(s, S.setup.gender);
const ctx = () => ctxOf(S, S.cur);
const b = (attrs, label, o = {}) => `<button class="b${o.cls ? ' ' + o.cls : ''}" ${attrs}${o.disabled ? ' disabled' : ''}${o.title ? ` title="${esc(o.title)}"` : ''}>${label}</button>`;
const act = (name, arg, label, o = {}) => b(`data-act="${name}"${arg !== undefined ? ` data-arg="${esc(arg)}"` : ''}`, label, o);
const g = (name, label, o = {}) => b(`data-g="${name}"${o.arg !== undefined ? ` data-arg="${esc(o.arg)}"` : ''}`, label, o);
function armed(key) {
  if (ui.arm === key) { ui.arm = null; clearTimeout(ui.armT); return true; }
  ui.arm = key; clearTimeout(ui.armT); ui.armT = setTimeout(() => { ui.arm = null; render(); }, 4000); return false;
}
const armLabel = (key, label) => (ui.arm === key ? 'Точно? Натисни ще раз' : label);
function commit() { SYNC.publish(S); render(); }
const connected = () => Date.now() - ui.lastPing < 2600;
const setupOk = () => { const s = S.setup; return !!(s.name.trim() && s.surname.trim() && s.group && s.age && s.gender); };
$('#memo').textContent = CONFIG.meetHint + ' Пульт і гра мають бути відкриті в одному браузері на одному комп’ютері.';

/* ---------- синхронізація ---------- */
SYNC.init('pult', m => {
  if (!m) return;
  if (m.type === 'ping') { const was = connected(); ui.lastPing = Date.now(); if (!was) { if (S.phase === 'setup') render(); else renderHeader(); } }
  if (m.type === 'hello') { ui.lastPing = Date.now(); SYNC.publish(S); if (S.phase === 'setup') render(); else renderHeader(); }
});

/* ---------- шапка ---------- */
function renderHeader() {
  const c = $('#conn'); c.classList.toggle('on', connected()); c.querySelector('span').textContent = connected() ? 'Вікно гри підключено' : 'Вікно гри не знайдено';
  $('#menu').innerHTML = g('menu', '⋯', { title: 'Меню' }) + (ui.menu ? `<div class="pop">
    ${g('reset', armLabel('reset', '↺ Нова діагностика'), { cls: ui.arm === 'reset' ? 'arm' : '' })}
    ${g('openGame', '↗ Відкрити вікно гри ще раз')}
    ${g('sound', S.sound ? '🔊 Звук у грі: увімкнено' : '🔇 Звук у грі: вимкнено')}</div>` : ''); emojify($('#menu'));
}

/* ---------- налаштування ---------- */
function viewSetup() {
  const s = S.setup, chip = (key, val, label) => b(`data-set="${key}" data-arg="${val}"`, label, { cls: s[key] == val ? 'sel' : '' });
  return `<div class="setup">
    <details class="how"><summary>Як це працює</summary><p style="margin:8px 0 0">Ти працюєш на пульті. Вікно гри — це мультик для дитини, на ньому нічого не натискається. У Google Meet показуй тільки вкладку чи вікно гри.</p></details>
    <div class="panel"><h2 style="font:700 18px var(--head);margin:0 0 12px">Налаштування уроку</h2>
      <div style="display:flex;flex-direction:column;gap:12px">
      <div class="frow"><label for="f-name">Ім’я дитини <span class="req">*</span></label><input class="inp" id="f-name" data-bind="name" value="${esc(s.name)}" maxlength="24"></div>
      <div class="frow"><label for="f-surname">Прізвище дитини <span class="req">*</span></label><input class="inp" id="f-surname" data-bind="surname" value="${esc(s.surname)}" maxlength="40" placeholder="для пошуку діагностики в таблиці"></div>
      <div class="frow"><label for="f-mik">МІК</label><input class="inp" id="f-mik" data-bind="mik" value="${esc(s.mik)}" maxlength="40" placeholder="хто проводить"></div>
      <div class="frow"><span class="l">Вікова група <span class="req">*</span></span><div class="chips">${chip('group', '78', '7–8 років')}${chip('group', '910', '9–10 років')}</div></div>
      <div class="frow"><span class="l">Вік <span class="req">*</span></span><div class="chips">${s.group ? CONFIG.groups[s.group].ages.map(a => chip('age', a, a)).join('') : '<span class="hint">спершу оберіть групу</span>'}</div></div>
      <div class="frow"><span class="l">Стать <span class="req">*</span></span><div class="chips">${chip('gender', 'm', 'Хлопчик')}${chip('gender', 'f', 'Дівчинка')}</div></div>
      </div></div>
    <div class="panel"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${g('openGame', '↗ Відкрити вікно гри', { cls: connected() ? '' : 'primary' })}
      <span class="hint">${connected() ? '✓ Вікно гри підключено.' : 'Відкрий вікно гри.'} ${esc(CONFIG.meetHint)}</span></div>
      ${ui.blocked ? `<div class="noti" style="margin-top:10px">Браузер заблокував нове вікно. Дозволь спливні вікна для цієї сторінки або відкрий гру вручну: <a href="index.html" target="ostriv-game">index.html</a> (у тому самому браузері).</div>` : ''}</div>
    <div style="display:flex;justify-content:flex-end">${g('start', 'Почати урок →', { cls: 'primary big', disabled: !(setupOk() && connected()) })}</div>
    <div class="hint" style="text-align:right">${!setupOk() ? 'Заповни обов’язкові поля (*). ' : ''}${!connected() ? '«Почати» стане активною, коли вікно гри буде підключено.' : ''}</div>
  </div>`;
}

/* ---------- сценарій кроку ---------- */
function scriptVars() {
  const key = S.cur, s = S.st[key], c = ctx(), gr = S.setup.group, v = {};
  if (!s) return v;
  if (key === 'emotions' && s.step === 'frames') { const f = emFrames(c)[s.fi]; Object.assign(v, { title: f.title, say: f.say || f.q || f.question || '' }); }
  if (key === 'money' && s.step === 'exact') { const t = c.C.targets[s.t]; if (t) Object.assign(v, { item: t.acc, price: t.sum, say: t.say || '' }); }
  if (key === 'money' && s.step === 'deal') { const d = c.C.deals[s.q] || {}; v.say = d.say || d.text || ''; }
  if (key === 'hike' && gr === '78') v.text = c.C.forecast.text;
  if (key === 'bob') { v.text = s.step === 'haggle' ? c.C.lines.haggle : c.C.need.name; v.line = T(ST.bob.lineText(s, c.C)); }
  if (key === 'playground' && gr === '78') v.text = c.C.judge.about;
  if (key === 'playground' && s.step === 'chat') v.say = (c.C.chat.messages[s.ci] || {}).say || '';
  if (key === 'radio') { v.guest = guestName(s); if (s.step === 'q') { const Q = c.C.questions[s.qi] || {}; v.say = fill(Q.say || '', { guest: v.guest }); v.quiet = Q.quiet || ''; v.wrap = Q.wrap || ''; } }
  if (key === 'final' && s.list) { const k = s.list[s.bi]; v.selfQ = k ? skillOf(k).selfQ : ''; }
  return v;
}
function scriptOf() {
  const key = S.cur, s = S.st[key]; if (!s) return {};
  let sc;
  if (key === 'hero') sc = CONFIG.script.hero.pick;
  else if (key === 'final') sc = CONFIG.script.final[s.step];
  else if (s.step === 'done') sc = CONFIG.script.done;
  else sc = CONFIG.script[key][s.step];
  sc = sc || {};
  // Боб: «Скажи дитині» — реакція на останню репліку Боба
  const R = CONFIG.script.bob.react;
  if (key === 'bob' && ['talk', 'trade', 'haggle', 'bye'].includes(s.step) && R[s.line]) sc = Object.assign({}, sc, { say: R[s.line] + (s.step === 'bye' ? ' ' + CONFIG.script.bob.bye.say : '') });
  const vars = scriptVars(), gr = S.setup.group, P = v => T(fill(fill(pick78(v, gr) || '', vars), vars));

function radarSVG(L) {
  const cx = 210, cy = 185, R = 118, K = SKILL_KEYS, n = K.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / 3, cy + Math.sin(a) * R * v / 3]; };
  let svg = '';
  [1, 2, 3].forEach(r => { svg += `<polygon points="${K.map((_, i) => pt(i, r).join(',')).join(' ')}" fill="none" stroke="#DCE0EA"/>`; });
  K.forEach((k, i) => { const [x, y] = pt(i, 3), [lx, ly] = pt(i, 3.6), off = !L[k].level;
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#DCE0EA"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="${off ? '#A3AAC0' : '#1E2A5A'}" font-family="Golos Text, system-ui">${esc(skillOf(k).area)}${off ? '*' : ''}</text>`; });
  const poly = (vals, attrs) => { const p = K.map((k, i) => (vals[k] ? pt(i, vals[k]) : null)).filter(Boolean); if (!p.length) return ''; if (p.length === 1) return `<circle cx="${p[0][0]}" cy="${p[0][1]}" r="4" ${attrs}/>`; return `<polygon points="${p.map(q => q.join(',')).join(' ')}" ${attrs}/>`; };
  const res = Object.fromEntries(K.map(k => [k, L[k].level]));
  svg += poly(res, 'fill="rgba(108,77,255,.12)" stroke="#6C4DFF" stroke-width="2.5" stroke-linejoin="round"');
  K.forEach((k, i) => { if (res[k]) { const [x, y] = pt(i, res[k]); svg += `<circle cx="${x}" cy="${y}" r="3.5" fill="#6C4DFF"/>`; } });
  svg += poly(S.self, 'fill="none" stroke="#1E2A5A" stroke-width="1.8" stroke-dasharray="6 5" opacity=".75"');
  return `<svg class="radar" width="420" height="370" viewBox="0 0 420 370" role="img" aria-label="Профіль навичок">${svg}</svg>`;
}
function rpSummary(L) {
  const sw = strongWeak(L), out = [], min = lessonMinutes(S);
  out.push(`${esc(S.setup.name)} пройш{ов|ла} ${sw.ev.length === 7 ? 'усі сім локацій' : `${sw.ev.length} із 7 локацій з оцінкою`}${min ? ` за ${min} хв` : ''}.`);
  if (!sw.ev.length) return out.join(' ');
  if (!sw.equal) {
    out.push(`Найсильніше сьогодні проявились ${RP.list(sw.strong.slice(0, 2).map(RP.name))}: дитина ${RP.list(sw.strong.slice(0, 2).map(k => skillOf(k).strong))}.`);
    out.push(`Найбільший простір для росту — ${RP.list(sw.weak.slice(0, 2).map(RP.name))}: ${RP.list(sw.weak.slice(0, 2).map(k => skillOf(k).grow))}.`);
  } else out.push(CONFIG.report.evenStart);
  const sf = S.st.safe, lk = sf && sf.locks && sf.locks[1];
  if (lk && !sf.skipped && sf.end !== 'skipped') { if (lk.hint) out.push('Біля сейфа дитина сама попросила підказку — це цінне вміння звертатися по допомогу.'); else if (sf.end === 'time' || lk.opened) out.push('Біля сейфа дитина працювала до кінця, не здаючись.'); }
  let u = 0, o = 0, s2 = 0; SKILL_KEYS.forEach(k => { const a = S.self[k], l = L[k].level; if (!a || !l) return; a < l ? u++ : a > l ? o++ : s2++; });
  if (u > o && u >= s2) out.push('Себе дитина оцінює скромніше, ніж показала гра, — їй важливо чути про свої успіхи.');
  else if (o > u && o >= s2) out.push('Себе дитина оцінює трохи вище за результати гри — це звичайна для віку впевненість, на яку можна спиратися.');
  else if (s2) out.push('Себе дитина бачить досить точно.');
  return out.slice(0, 5).join(' ');
}
function rpStyle() {
  const out = [], sf = S.st.safe, lk = sf && sf.locks && sf.locks[1];
  if (lk && !sf.skipped && sf.end !== 'skipped') {
    out.push(`<b>Звернення по допомогу.</b> На складнішому замку ${lk.stuckAt !== null ? 'дитина застрягала (3 спроби поспіль без нового зеленого)' : 'дитина не застрягала'}; підказку ${lk.hint ? 'просила' : 'не просила'}.`);
    out.push(`<b>Наполегливість.</b> Спроб на складнішому замку — ${lk.attempts.length}; ${sf.end === 'stopped' ? `зупинилась на ${fmtTime(sf.stoppedAt)}` : sf.end === 'time' ? 'працювала до кінця часу' : 'відкрила замок'}.`);
  }
  const hk = S.st.hike;
  if (S.setup.group === '910' && hk && hk.plan1 && hk.plan2) out.push(`<b>Зміна плану.</b> У розкладі походу порушень до зливи — ${hk.plan1.v.length}, після — ${hk.plan2.v.length}.`);
  if (S.setup.group === '78' && hk && hk.route) { const r = ctxOf(S, 'hike').C.routes.find(x => x.id === hk.route); out.push(`<b>Зміна плану.</b> Коли міст виявився зламаним, дитина обрала «${esc(r.name.toLowerCase())}».`); }
  const corr = SKILL_KEYS.reduce((a, k) => a + ((S.st[k] && S.st[k].corr) || 0), 0);
  out.push(`<b>Самовиправлення.</b> ${corr ? `Дитина змінювала свою відповідь ${corr} ${pl(corr, ['раз', 'рази', 'разів'])}.` : 'Дитина відповідала одразу, без виправлень.'}`);
  if (S.skips.probes || S.skips.stations) out.push(`<b>Пропуски.</b> Пропущено проб — ${S.skips.probes}, станцій — ${S.skips.stations}.`);
  return out;
}
function rpSelf(L) {
  const u = [], o = [], same = [];
  const rows = CONFIG.skills.map(sk => { const a = S.self[sk.key], l = L[sk.key].level; let rel = '—';
    if (a && l) { if (a < l) { rel = 'скромніше за результат'; u.push(sk.key); } else if (a > l) { rel = 'вище за результат'; o.push(sk.key); } else { rel = 'точно'; same.push(sk.key); } }
    return `<tr><td class="nm">${esc(sk.area)}</td><td>${RP.dots(a)}</td><td>${RP.lv(l)}</td><td>${rel}</td></tr>`; }).join('');
  const parts = []; if (u.length) parts.push(`недооцінює себе: ${RP.list(u.map(RP.name))}`); if (same.length) parts.push(`бачить себе точно: ${RP.list(same.map(RP.name))}`); if (o.length) parts.push(`оцінює себе вище, ніж показала гра: ${RP.list(o.map(RP.name))}`);
  return `<table><thead><tr><th>Навичка</th><th>Самооцінка</th><th>Результат</th><th>Як бачить себе</th></tr></thead><tbody>${rows}</tbody></table><p style="margin-top:8px">${parts.length ? 'Дитина ' + parts.join('; ') + '.' : 'Самооцінку не заповнено.'}${u.length ? ' Там, де дитина себе недооцінює, особливо важливо помічати й називати її успіхи.' : ''}</p>`;
}
function rpRecommend(L) {
  const pk = pickStart(S, L); if (!pk.length) return '<p>Недостатньо даних.</p>';
  return `<h3 style="margin-bottom:4px">З чого почати на курсі</h3><ul>${pk.map(p => `<li><b>${esc(skillOf(p.k).area)}.</b> ${p.why[0].toUpperCase() + p.why.slice(1)}. ${esc(skillOf(p.k).training)}</li>`).join('')}</ul>
    <h3 style="margin:8px 0 4px">Що помічати й хвалити вдома</h3><ul>${pk.map(p => `<li><b>${esc(skillOf(p.k).area)}:</b> ${esc(skillOf(p.k).praise)}</li>`).join('')}<li>Хваліть зусилля, спроби й стратегію, а не лише результат.</li></ul>`;
}
function viewReport() {
  const L = scoreAll(S), gr = S.setup.group, min = lessonMinutes(S), tk = titleSkill(S, L);
  const meta = [['Дитина', esc(`${S.setup.name} ${S.setup.surname}`.trim())], ['Вік', `${S.setup.age} ${pl(S.setup.age, ['рік', 'роки', 'років'])}`], ['Група', CONFIG.groups[gr].label], ['Дата', fmtDate(S.t.lessonStart || S.date)], ['Тривалість', min ? `${min} хв` : '—']];
  if (S.setup.mik.trim()) meta.push(['МІК', esc(S.setup.mik)]);
  const table = CONFIG.skills.map(sk => { const r = L[sk.key], pn = probeNames(sk.key, gr);
    return `<tr><td class="nm">${esc(sk.area)}</td><td>${esc(RP.measured(sk))}</td><td>${r.skipped && !r.p1 && !r.p2 ? esc(CONFIG.report.skippedStation) : `${esc(pn[0])}: ${RP.probe(r.p1)}${r.single ? '' : `<br>${esc(pn[1])}: ${RP.probe(r.p2)}`}`}</td><td>${RP.lv(r.level)}</td><td>${RP.dots(S.self[sk.key])}</td></tr>`; }).join('');
  const skills = CONFIG.skills.map(sk => { const r = L[sk.key], pn = probeNames(sk.key, gr), Tx = r.level ? sk.levels[r.level] : null;
    const probes = r.p1 || r.p2 ? `<ul>${r.p1 ? `<li>${esc(pn[0])}: ${esc(r.p1.ev)}</li>` : `<li>${esc(pn[0])}: пропущено</li>`}${r.single ? '' : r.p2 ? `<li>${esc(pn[1])}: ${esc(r.p2.ev)}</li>` : `<li>${esc(pn[1])}: ${sk.key === 'safe' ? 'не оцінено' : 'пропущено'}</li>`}</ul>` : esc(S.st[sk.key] && S.st[sk.key].skipped ? CONFIG.report.skippedStation : CONFIG.report.skippedAll);
    return `<div class="rp-skill" id="sk-${sk.key}"><div class="hd"><h3>${esc(sk.area)}</h3>${RP.lv(r.level)}</div><dl><dt>Навіщо це</dt><dd>${esc(sk.about)}</dd><dt>Що робила дитина</dt><dd>${probes}</dd>
      ${Tx ? `<dt>Що означає рівень</dt><dd>${esc(Tx.meaning)}</dd><dt>Як це проявляється</dt><dd>${esc(Tx.life)}</dd><dt>Вправи вдома (5–10 хв)</dt><dd><ul>${Tx.home.map(h => `<li>${esc(h)}</li>`).join('')}</ul></dd>` : ''}</dl></div>`; }).join('');
  const marks = CONFIG.skills.map(sk => `<button class="mark" data-g="goto" data-arg="${sk.key}">${CONFIG.levelColors[L[sk.key].level || 0]} ${esc(sk.area)}</button>`).join('');
  const html = `<div class="rp-top no-print" data-html2canvas-ignore="true"><span class="nm">${esc(S.setup.name)}</span><span class="ttl">Титул: ${esc(skillOf(tk).title)}</span><div class="marks">${marks}</div></div>
    <div class="rp" id="report"><div class="rp-brand">${esc(CONFIG.report.brand)}</div><h1>${esc(CONFIG.report.title)}</h1>
    <dl class="rp-meta">${meta.map(([a, z]) => `<div><dt>${a}</dt><dd>${z}</dd></div>`).join('')}</dl>
    <section><h2>1. Підсумок</h2><p>${rpSummary(L)}</p></section>
    <section><h2>2. Профіль</h2><div class="rp-profile"><div>${radarSVG(L)}<div class="rp-legend"><span>— результат</span><span>- - самооцінка</span></div>${SKILL_KEYS.some(k => !L[k].level) ? '<div class="rp-note">* не оцінено — пропущено</div>' : ''}</div>
      <table><thead><tr><th>Навичка</th><th>Що вимірювали</th><th>Результати двох проб</th><th>Рівень</th><th>Самооцінка</th></tr></thead><tbody>${table}</tbody></table></div></section>
    <section><h2>3. По кожній навичці</h2><div class="rp-skills">${skills}</div></section>
    <section><h2>4. Стиль роботи</h2><ul>${rpStyle().map(x => `<li>${x}</li>`).join('')}</ul><p class="rp-note">Це спостереження, а не оцінки.</p></section>
    <section><h2>5. Самооцінка й результат</h2>${rpSelf(L)}</section>
    <section><h2>6. Рекомендації</h2>${rpRecommend(L)}</section>
</div>
    <div class="rp-actions no-print" data-html2canvas-ignore="true">${g('print', 'Зберегти PDF', { cls: 'primary' })}<span id="sheetStatus" class="rp-note">${sheetStatusHTML()}</span><span style="flex:1"></span>${g('back', '← До уроку')}</div>`;
  return T(html);
}

/* ---------- Google Таблиця + PDF (html2pdf.js 0.10.1) ---------- */
const SHEET_Q = CONFIG.storageKey + '-sheets-queue';
const H2P = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
const sheetQueue = () => { try { return JSON.parse(localStorage.getItem(SHEET_Q)) || []; } catch (e) { return []; } };
const sheetSave = q => { try { localStorage.setItem(SHEET_Q, JSON.stringify(q)); return true; } catch (e) { return false; } };
function sheetStatusHTML() {
  if (!CONFIG.sheets.endpoint) return '';
  const st = S.sheet && S.sheet.status;
  return st === 'sent' ? 'Надіслано ✓' : st === 'failed' ? `Не надіслано — ${g('sheetRetry', 'повторити')}` : st === 'pending' ? 'Надсилаю в таблицю…' : '';
}
function sheetShow() { const el = $('#sheetStatus'); if (el) el.innerHTML = sheetStatusHTML(); }
function loadH2P() {
  if (window.html2pdf) return Promise.resolve(window.html2pdf);
  return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = H2P; sc.onload = () => res(window.html2pdf); sc.onerror = rej; document.head.appendChild(sc); });
}
// PDF звіту в base64 (на клієнті). Якщо бібліотека недоступна — null, рядок однаково надсилається.
async function reportPdfBase64(fileName) {
  try {
    const h2p = await loadH2P(), src = $('#report'); if (!h2p || !src) return null;
    const box = document.createElement('div'); box.style.cssText = 'position:absolute;left:0;top:0;z-index:-1;width:718px;background:#fff';
    const el = src.cloneNode(true); el.removeAttribute('id'); el.classList.add('pdf'); box.appendChild(el); document.body.appendChild(box); const sy = window.scrollY; window.scrollTo(0, 0);
    const uri = await h2p().set({ margin: 10, filename: fileName, image: { type: 'jpeg', quality: 0.85 }, html2canvas: { scale: 1.5, useCORS: true, scrollX: 0, scrollY: 0 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['css'], avoid: ['.rp-skill', 'tr', 'h2', 'li'] } }).from(el).outputPdf('datauristring').then(u => { box.remove(); window.scrollTo(0, sy); return u; }, e => { box.remove(); window.scrollTo(0, sy); throw e; });
    return String(uri).split(',')[1] || null;
  } catch (e) { console.warn('PDF не згенеровано', e); return null; }
}
async function sheetFlush() {
  const { endpoint, token } = CONFIG.sheets; if (!endpoint) return;
  let q = sheetQueue(); if (!q.length) return;
  for (const it of q.slice()) {
    try {
      if (it.id === S.id && !it.pdf && S.phase === 'report' && $('#report')) it.pdf = await reportPdfBase64(it.fileName);
      await fetch(endpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ token, id: it.id, headers: it.headers, row: it.row, fileName: it.fileName, pdf: it.pdf || null }) });
      q = sheetQueue().filter(x => x.id !== it.id); sheetSave(q);
      if (it.id === S.id) S.sheet = { status: 'sent', at: Date.now() };
    } catch (e) { if (it.id === S.id) S.sheet = { status: 'failed', at: Date.now() }; }
  }
  SYNC.publish(S); sheetShow();
}
// перше відкриття звіту → PDF + рядок у чергу → надіслати
async function sheetOnReport() {
  if (!CONFIG.sheets.endpoint || S.sheet) { sheetShow(); return; }
  S.sheet = { status: 'pending' }; SYNC.publish(S); sheetShow();
  const rec = sheetRecord(S), pdf = await reportPdfBase64(rec.fileName);
  const item = { id: S.id, headers: rec.headers, row: rec.row, fileName: rec.fileName, pdf };
  const q = sheetQueue().filter(x => x.id !== S.id);
  if (!sheetSave(q.concat([item]))) sheetSave(q.concat([Object.assign({}, item, { pdf: null })]));   // PDF не влазить у localStorage — згенеруємо при повторі
  sheetFlush();
}

/* ---------- рендер ---------- */
function render() {
  renderHeader();
  const app = $('#app');
  if (S.phase === 'setup') { app.innerHTML = viewSetup(); emojify(app); return; }
  if (S.phase === 'report' && ui.view !== 'lesson') { app.innerHTML = viewReport(); emojify(app); sheetOnReport(); return; }
  app.innerHTML = viewLesson(); emojify(app);
}

/* ---------- дії ---------- */
function openGame() {
  const w = window.open('index.html', 'ostriv-game', 'width=1280,height=800');
  ui.blocked = !w; if (w) setTimeout(() => SYNC.publish(S), 600); render();
}
function doUndo() {
  if (!ui.undo.length) return;
  const n = S.fx ? S.fx.n : 0, prev = JSON.parse(ui.undo.pop());
  prev.fx = { n: n + 1, kind: '', data: null, at: Date.now() };
  S = prev; const s = S.st[S.cur]; if (s) s.corr = (s.corr || 0) + 1;
  commit();
}
const GA = {
  menu() { ui.menu = !ui.menu; renderHeader(); },
  reset() { if (!armed('reset')) { renderHeader(); return; } const snd = S.sound; S = freshState(snd); ui.undo = []; ui.menu = false; ui.view = null; commit(); },
  openGame() { openGame(); },
  sound() { S.sound = !S.sound; commit(); },
  start() { if (!connected() || !setupOk()) return; A.start(S); ui.undo = []; commit(); },
  next() { A.next(S); ui.undo = []; if (S.phase === 'report') ui.view = null; commit(); },
  undo() { doUndo(); },
  skipProbe() { if (!armed('skipProbe')) { render(); return; } A.skipProbe(S); ui.undo = []; commit(); },
  skipStation() { if (!armed('skipStation')) { render(); return; } A.skipStation(S); ui.undo = []; commit(); },
  report() { ui.view = null; render(); },
  back() { ui.view = 'lesson'; render(); },
  print() { window.print(); },
  sheetRetry() { S.sheet = { status: 'pending' }; sheetShow(); sheetFlush(); },
  goto(k) { const el = document.getElementById('sk-' + k); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  ex(a) { ui.ex[a] = !ui.ex[a]; render(); }
};
document.addEventListener('click', e => {
  if (ui.menu && !e.target.closest('#menu')) { ui.menu = false; renderHeader(); }
  const el = e.target.closest('[data-act],[data-g],[data-set]'); if (!el || el.disabled) return;
  if (el.dataset.set) { const k = el.dataset.set, v = el.dataset.arg; S.setup[k] = k === 'age' ? +v : v; if (k === 'group' && !CONFIG.groups[v].ages.includes(S.setup.age)) S.setup.age = null; commit(); return; }
  if (el.dataset.g) {
    const fn = el.dataset.g;
    if (['next', 'skipProbe', 'skipStation', 'start'].includes(fn) && ui.arm !== fn) { const now = Date.now(); if (now - ui.lastT < 450) return; ui.lastT = now; }
    GA[fn](el.dataset.arg); return;
  }
  doAct(el.dataset.act, el.dataset.arg);
});
function doAct(name, arg) {
  const snap = JSON.stringify(S);
  const r = A.act(S, name, arg);
  if (r === false) return;
  if (r === 'fx') { SYNC.publish(S); return; }
  ui.undo.push(snap); if (ui.undo.length > 60) ui.undo.shift();
  commit();
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.guest) { A.act(S, 'guest', t.value); SYNC.publish(S); const nb = document.querySelector('[data-g="next"]'); if (nb) nb.disabled = !ST.radio.canNext(S.st.radio); return; }
  const k = t.dataset.bind; if (!k) return;
  S.setup[k] = t.value; SYNC.publish(S);
  const btn = document.querySelector('[data-g="start"]'); if (btn) btn.disabled = !(setupOk() && connected());
});
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (S.phase !== 'lesson') return;
  if (e.key === ' ') { const s = S.st[S.cur]; e.preventDefault(); if (S.cur === 'emotions' && s && s.step === 'calm') doAct('plus'); }
  if (e.key === 'Enter') { e.preventDefault(); const nb = document.querySelector('[data-g="next"]'); if (nb && !nb.disabled) { const now = Date.now(); if (now - ui.lastT >= 450) { ui.lastT = now; GA.next(); } } }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')) { e.preventDefault(); doUndo(); }
});

/* ---------- таймер і стан підключення ---------- */
setInterval(() => {
  if (A.tick(S)) { ui.undo = []; commit(); }
  document.querySelectorAll('.timer[data-ends]').forEach(el => { el.textContent = fmtTime(Math.ceil(Math.max(0, (+el.dataset.ends - Date.now()) / 1000))); });
  const t = $('#total'); if (t && S.t.lessonStart) t.textContent = `${Math.floor(((S.t.lessonEnd || Date.now()) - S.t.lessonStart) / 60000)} хв з ${CONFIG.planMinutes}`;
  const c = $('#conn'); if (c && c.classList.contains('on') !== connected()) { renderHeader(); if (S.phase === 'setup') render(); }
}, 250);

render();
SYNC.publish(S);
if (CONFIG.sheets.endpoint && sheetQueue().length) sheetFlush();
if (new URLSearchParams(location.search).get('test') === '1') selfTest();
</script>
